# Port to sink: receive from DPDK port 0 and drop. For more ports, repeat the
# port and its two modules with port_id 1, 2, ...
#
# Converted from p2s.bess (D-134).
ports:
  - name: pmd0
    driver: PMDPort
    arg: {port_id: 0}
modules:
  - name: inc0
    mclass: PortInc
    arg: {port: pmd0}
  - name: sink0
    mclass: Sink
connections:
  - upstream: inc0
    downstream: sink0
workers:
  - {wid: 0, core: 0}
tasks:
  - module: inc0
    wid: 0
