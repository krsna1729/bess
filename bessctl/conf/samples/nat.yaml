# NAT and StaticNAT on UDP/TCP packets, with MAC and IP swaps for the
# return path.
#
# Converted from nat.bess (D-104). Rewrite templates are the packets it
# built with scapy.
modules:
  - name: ipswap0
    mclass: IPSwap
  - name: ipswap1
    mclass: IPSwap
  - name: macswap0
    mclass: MACSwap
  - name: macswap1
    mclass: MACSwap
  - name: nat
    mclass: NAT
    arg:
      ext_addrs:
        - ext_addr: "192.168.0.1"
        - ext_addr: "192.168.0.2"
  - name: rewrite0
    mclass: Rewrite
    arg:
      templates:
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARYLSsEGQBCgAAAScRJxIAEnd0aGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARUuesDDdjDCI4TicRJxIAEmmnaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARjVasDDdjCgAAAScRJxIAEqQWaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARJkWsEGQBDCI4TicRJxIAEj0FaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAyAAEAAEAGUuasDDdjDCI4TicRJxIAAAAAAAAAAFACIAD5tQAAaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARdDPAqAF7DCI4TicRJxIAEorzaGVsbG93b3JsZA=="
  - name: rewrite1
    mclass: Rewrite
    arg:
      templates:
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARYLSsEGQBCgAAAScRJxIAEnd0aGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARUuesDDdjDCI4TicRJxIAEmmnaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARjVasDDdjCgAAAScRJxIAEqQWaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARJkWsEGQBDCI4TicRJxIAEj0FaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAyAAEAAEAGUuasDDdjDCI4TicRJxIAAAAAAAAAAFACIAD5tQAAaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARdDPAqAF7DCI4TicRJxIAEorzaGVsbG93b3JsZA=="
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: source0
    mclass: Source
  - name: source1
    mclass: Source
  - name: static_nat
    mclass: StaticNAT
    arg:
      pairs:
        - int_range:
            start: "172.16.0.0"
            end: "172.31.255.255"
          ext_range:
            start: "55.1.0.0"
            end: "55.16.255.255"
        - int_range:
            start: "192.168.0.0"
            end: "192.168.255.255"
          ext_range:
            start: "66.77.0.0"
            end: "66.77.255.255"
connections:
  - upstream: ipswap0
    downstream: nat
    igate: 1
  - upstream: ipswap1
    downstream: static_nat
    igate: 1
  - upstream: macswap0
    downstream: ipswap0
  - upstream: macswap1
    downstream: ipswap1
  - upstream: nat
    downstream: sink0
  - upstream: nat
    ogate: 1
    downstream: macswap0
  - upstream: rewrite0
    downstream: nat
  - upstream: rewrite1
    downstream: static_nat
  - upstream: source0
    downstream: rewrite0
  - upstream: source1
    downstream: rewrite1
  - upstream: static_nat
    downstream: sink1
  - upstream: static_nat
    ogate: 1
    downstream: macswap1
workers:
  - {wid: 0, core: 0}
