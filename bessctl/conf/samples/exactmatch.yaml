# ExactMatch on (IP protocol, source IP, destination IP): three rules;
# anything else goes to the default gate 5.
#
# Converted from exactmatch.bess (D-104). Rewrite templates are the packets it
# built with scapy.
modules:
  - name: em
    mclass: ExactMatch
    arg:
      default_gate: 5
      fields:
        - offset: 23
          num_bytes: 1
        - offset: 26
          num_bytes: 4
        - offset: 30
          num_bytes: 4
  - name: rewrite0
    mclass: Rewrite
    arg:
      templates:
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARYLSsEGQBCgAAAScRJxIAEnd0aGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARUuesDDdjDCI4TicRJxIAEmmnaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARjVasDDdjCgAAAScRJxIAEqQWaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARJkWsEGQBDCI4TicRJxIAEj0FaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAyAAEAAEAGUuasDDdjDCI4TicRJxIAAAAAAAAAAFACIAD5tQAAaGVsbG93b3JsZA=="
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAEARdDPAqAF7DCI4TicRJxIAEorzaGVsbG93b3JsZA=="
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: sink2
    mclass: Sink
  - name: sink3
    mclass: Sink
  - name: source0
    mclass: Source
connections:
  - upstream: em
    downstream: sink0
  - upstream: em
    ogate: 1
    downstream: sink1
  - upstream: em
    ogate: 2
    downstream: sink2
  - upstream: em
    ogate: 5
    downstream: sink3
  - upstream: rewrite0
    downstream: em
  - upstream: source0
    downstream: rewrite0
workers:
  - {wid: 0, core: 0}
tasks:
  - module: source0
    wid: 0
resources:
  em/rules:
    - key: {fields: [{value_bin: EQ==}, {value_bin: rBBkAQ==}, {value_bin: CgAAAQ==}]}
      value: {gate: 0}
    - key: {fields: [{value_bin: Bg==}, {value_bin: rAw3Yw==}, {value_bin: DCI4Tg==}]}
      value: {gate: 1}
    - key: {fields: [{value_bin: EQ==}, {value_bin: rAw3Yw==}, {value_bin: DCI4Tg==}]}
      value: {gate: 2}
