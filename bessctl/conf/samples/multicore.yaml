# Two workers on two cores, one Source task on each.
#
# Converted from multicore.bess (D-104).
modules:
  - name: sink
    mclass: Sink
  - name: src0
    mclass: Source
  - name: src1
    mclass: Source
connections:
  - upstream: src0
    downstream: sink
  - upstream: src1
    downstream: sink
workers:
  - {wid: 0, core: 0}
  - wid: 1
    core: 1
tasks:
  - module: src0
    wid: 0
  - module: src1
    wid: 1
