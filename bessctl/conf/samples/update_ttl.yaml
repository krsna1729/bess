# UpdateTTL: decrements the IPv4 TTL, dropping packets whose TTL is 1 or
# less.
#
# Converted from update_ttl.bess (D-104). Rewrite templates are the packets it
# built with scapy.
modules:
  - name: rewrite0
    mclass: Rewrite
    arg:
      templates:
        - "BhY+G3IyAh5nn02uCABFAAAmAAEAAAIR7RzAqAEBCgAAAScRJxIAEsXcaGVsbG93b3JsZA=="
  - name: rr
    mclass: RoundRobin
    arg:
      gates:
        - "1"
        - "2"
        - "3"
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: sink2
    mclass: Sink
  - name: source0
    mclass: Source
  - name: update_ttl0
    mclass: UpdateTTL
  - name: update_ttl1
    mclass: UpdateTTL
  - name: update_ttl2
    mclass: UpdateTTL
  - name: update_ttl3
    mclass: UpdateTTL
  - name: update_ttl4
    mclass: UpdateTTL
  - name: update_ttl5
    mclass: UpdateTTL
connections:
  - upstream: rewrite0
    downstream: rr
  - upstream: rr
    ogate: 1
    downstream: update_ttl0
  - upstream: rr
    ogate: 2
    downstream: update_ttl1
  - upstream: rr
    ogate: 3
    downstream: update_ttl3
  - upstream: source0
    downstream: rewrite0
  - upstream: update_ttl0
    downstream: sink0
  - upstream: update_ttl1
    downstream: update_ttl2
  - upstream: update_ttl2
    downstream: sink1
  - upstream: update_ttl3
    downstream: update_ttl4
  - upstream: update_ttl4
    downstream: update_ttl5
  - upstream: update_ttl5
    downstream: sink2
workers:
  - {wid: 0, core: 0}
