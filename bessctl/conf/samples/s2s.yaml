# Source to Sink: the smallest pipeline (60-byte packets, the .bess default of
# $BESS_PKT_SIZE).
#
# Converted from s2s.bess (D-104).
modules:
  - name: sink0
    mclass: Sink
  - name: source0
    mclass: Source
    arg:
      pkt_size: "60"
connections:
  - upstream: source0
    downstream: sink0
workers:
  - {wid: 0, core: 0}
