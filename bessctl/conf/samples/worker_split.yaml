# WorkerSplit: packets go out the gate of the worker that runs them; four
# Sources placed on two workers.
#
# Converted from worker_split.bess (D-104).
modules:
  - name: bypass0
    mclass: Bypass
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: src0
    mclass: Source
  - name: src1
    mclass: Source
  - name: src2
    mclass: Source
  - name: src3
    mclass: Source
  - name: ws
    mclass: WorkerSplit
connections:
  - upstream: bypass0
    downstream: ws
  - upstream: src0
    downstream: bypass0
  - upstream: src1
    downstream: bypass0
  - upstream: src2
    downstream: bypass0
  - upstream: src3
    downstream: bypass0
  - upstream: ws
    downstream: sink0
  - upstream: ws
    ogate: 1
    downstream: sink1
workers:
  - {wid: 0, core: 0}
  - wid: 1
    core: 1
tasks:
  - module: src0
    wid: 0
  - module: src1
    wid: 0
  - module: src2
    wid: 1
  - module: src3
    wid: 1
