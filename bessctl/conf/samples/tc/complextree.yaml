# A traffic-class tree: priority, weighted fair and rate-limited classes
# over three Sources.
#
# Converted from complextree.bess (D-104).
modules:
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: sink2
    mclass: Sink
  - name: src0
    mclass: Source
  - name: src1
    mclass: Source
  - name: src2
    mclass: Source
connections:
  - upstream: src0
    downstream: sink0
  - upstream: src1
    downstream: sink1
  - upstream: src2
    downstream: sink2
workers:
  - {wid: 0, core: 0}
traffic_classes:
  - name: "1"
    parent: rest
    policy: weighted_fair
    resource: bit
    wid: -1
  - name: "11"
    parent: "1"
    policy: round_robin
    wid: -1
    share: "5"
  - name: "12"
    parent: "1"
    policy: round_robin
    wid: -1
    share: "6"
  - name: "2"
    parent: rest
    policy: round_robin
    wid: -1
  - name: main
    policy: priority
  - name: rest
    parent: main
    policy: round_robin
    wid: -1
    priority: "100"
  - name: rl
    parent: main
    policy: rate_limit
    resource: bit
    wid: -1
    priority: "5"
    limit:
      bit: "300000"
tasks:
  - module: src0
    parent: rl
  - module: src1
    parent: "1"
    share: "2"
  - module: src2
    parent: main
    priority: "1000"
