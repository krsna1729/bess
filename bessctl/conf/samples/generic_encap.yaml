# GenericEncap: a dummy L2 header of two fixed MAC addresses and an ethertype
# (0x9876) taken from the metadata attribute SetMetadata sets.
#
# Converted from generic_encap.bess (D-104). Rewrite templates are the packets it
# built with scapy.
modules:
  - name: generic_encap0
    mclass: GenericEncap
    arg:
      fields:
        - size: "6"
          value:
            value_int: "2199023255553"
        - size: "6"
          value:
            value_int: "6708179877615"
        - size: "2"
          attribute: ether_type
  - name: rewrite0
    mclass: Rewrite
    arg:
      templates:
        - "AAIVN6JEAK7zUqrRCABFAAAnAAEAAEARfMN/AAABfwAAAQA1ADUAE6+NSGVsbG8gV29ybGQ="
  - name: setattr0
    mclass: SetMetadata
    arg:
      attrs:
        - name: ether_type
          size: "2"
          value_int: "39030"
  - name: sink0
    mclass: Sink
  - name: source0
    mclass: Source
connections:
  - upstream: generic_encap0
    downstream: sink0
  - upstream: rewrite0
    downstream: generic_encap0
  - upstream: setattr0
    downstream: rewrite0
  - upstream: source0
    downstream: setattr0
workers:
  - {wid: 0, core: 0}
