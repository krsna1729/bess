# The Router in destination mode (D-155): 172.16.0.0/16 to next hop 1 (gate
# 1), 192.168.1.0/24 to next hop 2 (gate 2), the default route to next hop 5
# (gate 5); 60-byte packets (the .bess default of $BESS_PKT_SIZE).
#
# Converted from iplookup.bess (D-104) -- the sample IPLookup had, on the
# module that holds the FIB now. Rewrite templates are the packets it built
# with scapy; the Router writes each next hop's addresses into the frame it
# forwards (`AgAAAAAB`/`AgAAAAAC` are 02:00:00:00:00:01/02; the proto's fields
# are bytes).
modules:
  - name: ipfwd
    mclass: Router
    arg: {mode: ROUTE_MODE_DESTINATION, max_routes: 16, max_next_hops: 8}
  - name: rewrite0
    mclass: Rewrite
    arg:
      templates:
        - BhY+G3IyAh5nn02uCABFAAAuAAEAAEARZqcBAgMErBBkAScRJxIAGh5GaGVsbG8wMTIzNDU2Nzg5MDEy
        - BhY+G3IyAh5nn02uCABFAAAuAAEAAEARk0kBAgMErAw3YycRJxIAGkroaGVsbG8wMTIzNDU2Nzg5MDEy
        - BhY+G3IyAh5nn02uCABFAAAuAAEAAEARtJUBAgMEwKgBeycRJxIAGmw0aGVsbG8wMTIzNDU2Nzg5MDEy
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: sink2
    mclass: Sink
  - name: sink3
    mclass: Sink
  - name: source0
    mclass: Source
connections:
  - upstream: ipfwd
    downstream: sink0
  - upstream: ipfwd
    ogate: 1
    downstream: sink1
  - upstream: ipfwd
    ogate: 2
    downstream: sink2
  - upstream: ipfwd
    ogate: 5
    downstream: sink3
  - upstream: rewrite0
    downstream: ipfwd
  - upstream: source0
    downstream: rewrite0
workers:
  - {wid: 0, core: 0}
tasks:
  - module: source0
    wid: 0
resources:
  ipfwd/next_hops:
    - key: {id: 1}
      value: {egress_gate: 1, dst_mac: "AgAAAAAC", src_mac: "AgAAAAAB"}
    - key: {id: 2}
      value: {egress_gate: 2, dst_mac: "AgAAAAAC", src_mac: "AgAAAAAB"}
    - key: {id: 5}
      value: {egress_gate: 5, dst_mac: "AgAAAAAC", src_mac: "AgAAAAAB"}
  ipfwd/routes:
    - key: {ipv4: 172.16.0.0, prefix_length: 16}
      value: {next_hop_id: 1}
    - key: {ipv4: 192.168.1.0, prefix_length: 24}
      value: {next_hop_id: 2}
    - key: {ipv4: 0.0.0.0, prefix_length: 0}
      value: {next_hop_id: 5}
