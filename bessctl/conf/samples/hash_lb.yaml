# HashLB in mode l4 (the .bess default of $MODE): packets with randomized
# destination ports spread over three gates.
#
# Converted from hash_lb.bess (D-104). Rewrite templates are the packets it
# built with scapy.
modules:
  - name: hlb
    mclass: HashLB
    arg:
      gates:
        - "0"
        - "1"
        - "2"
      mode: l4
  - name: rewrite
    mclass: Rewrite
    arg:
      templates:
        - "BhY+G3IyAh5nn02sCABFAAAmAAEAAEARrxzAqAEBCgAAAScRJxIAEsXcaGVsbG93b3JsZA=="
  - name: rupdate0
    mclass: RandomUpdate
    arg:
      fields:
        - offset: "34"
          size: "2"
          min: "1"
          max: "1023"
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: sink2
    mclass: Sink
  - name: source0
    mclass: Source
connections:
  - upstream: hlb
    downstream: sink0
  - upstream: hlb
    ogate: 1
    downstream: sink1
  - upstream: hlb
    ogate: 2
    downstream: sink2
  - upstream: rewrite
    downstream: rupdate0
  - upstream: rupdate0
    downstream: hlb
  - upstream: source0
    downstream: rewrite
workers:
  - {wid: 0, core: 0}
