# SPDX-License-Identifier: BSD-3-Clause

# VRF-style routing: one FIB per route domain (D-155). The Vif's two
# interfaces tell the tenants apart -- Red's frames are addressed to
# 02:00:00:00:00:11, Blue's to 02:00:00:00:00:12, both untagged -- and write
# route_domain 1 and 2; 10.0.0.0/8 goes to each tenant's own gateway (gate 1
# for Red, gate 2 for Blue), each default route to gate 0.
#
# Converted from vrf_routing.bess (D-104) -- two IPLookups, one per tenant,
# now one Router with two domains; the Rewrite templates are the packets it
# built with scapy, readdressed to the two Vif interfaces (`AgAAAAAB`/
# `AgAAAAAC` are the next hops' 02:00:00:00:00:01/02 as bytes base64).
modules:
  - name: vif
    mclass: Vif
    arg:
      interfaces:
        - id: 1
          vlan: 0
          mac_addr: "02:00:00:00:00:11"
          ip_addr: "10.0.0.1"
          route_domain: 1
          gate: 0
        - id: 2
          vlan: 0
          mac_addr: "02:00:00:00:00:12"
          ip_addr: "10.0.0.2"
          route_domain: 2
          gate: 0
      default_gate: 3
  - name: router0
    mclass: Router
    arg: {mode: ROUTE_MODE_DESTINATION, max_routes: 16, max_next_hops: 4, max_domains: 3}
  - name: rewrite0
    mclass: Rewrite
    arg:
      templates:
        - AgAAAAARAh5nn02uCABFAAAuAAEAAEARrRHAqAEBCgECAycRJxIAGjYGVlJGX1JPVVRJTkdfUEFDS0VU
        - AgAAAAASAh5nn02uCABFAAAuAAEAAEARwqmsEAABCgECAycRJxIAGkueVlJGX1JPVVRJTkdfUEFDS0VU
  - name: sink0
    mclass: Sink
  - name: sink1
    mclass: Sink
  - name: sink2
    mclass: Sink
  - name: sink3
    mclass: Sink
  - name: source0
    mclass: Source
connections:
  - upstream: vif
    downstream: router0
  - upstream: vif
    ogate: 3
    downstream: sink3
  - upstream: router0
    downstream: sink0
  - upstream: router0
    ogate: 1
    downstream: sink1
  - upstream: router0
    ogate: 2
    downstream: sink2
  - upstream: rewrite0
    downstream: vif
  - upstream: source0
    downstream: rewrite0
workers:
  - {wid: 0, core: 0}
tasks:
  - module: source0
    wid: 0
resources:
  router0/next_hops:
    - key: {id: 1}
      value: {egress_gate: 1, dst_mac: "AgAAAAAC", src_mac: "AgAAAAAB"}
    - key: {id: 2}
      value: {egress_gate: 2, dst_mac: "AgAAAAAC", src_mac: "AgAAAAAB"}
    - key: {id: 3}
      value: {egress_gate: 0, dst_mac: "AgAAAAAC", src_mac: "AgAAAAAB"}
  router0/routes:
    - key: {ipv4: 10.0.0.0, prefix_length: 8, domain: 1}
      value: {next_hop_id: 1}
    - key: {ipv4: 0.0.0.0, prefix_length: 0, domain: 1}
      value: {next_hop_id: 3}
    - key: {ipv4: 10.0.0.0, prefix_length: 8, domain: 2}
      value: {next_hop_id: 2}
    - key: {ipv4: 0.0.0.0, prefix_length: 0, domain: 2}
      value: {next_hop_id: 3}
