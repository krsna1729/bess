# Container provisioning for building BESS with multiple compiler
# configurations.

# all packages for build are also required here
- name: Install basic build requirements first
  import_playbook: build-dep.yml

- name: Vport kernel module dependencies
  import_playbook: kmod.yml

- hosts: all
  tags: ci
  tasks:
    - name: Install modern compiler tooling (Ubuntu 24.04+)
      apt: name={{item}} update_cache=yes
      become: true
      with_items:
        - clang
        - ccache
      when: ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>=')

    - name: Install legacy compilers (pre-Ubuntu 24.04)
      apt: name={{item}} update_cache=yes
      become: true
      with_items:
        - g++-8
        - clang-6.0
        - ccache
      when: ansible_distribution_version is version('24.04', '<')
