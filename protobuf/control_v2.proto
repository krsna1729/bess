// SPDX-License-Identifier: BSD-3-Clause

syntax = "proto3";

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";

package bess.pb.v2;

// BESS v2 control API (G1): coarse-grained and desired-state oriented.
//
// A client describes the whole pipeline it wants; bessd validates it, works
// out what has to change, and applies it as one transaction with rollback --
// the G0 engine (core/control/). No client orders BESS internals or rolls
// anything back itself.
//
// Errors are gRPC status codes (INVALID_ARGUMENT, NOT_FOUND, ALREADY_EXISTS,
// ABORTED for a generation conflict, FAILED_PRECONDITION for a busy
// resource, UNIMPLEMENTED for a change that cannot be made transactionally,
// INTERNAL), with an ErrorDetail serialized into the "bess-error-bin"
// trailing metadata for typed client handling.
//
// The legacy imperative BESSControl service is unchanged and served alongside.

// -- desired state ------------------------------------------------------------

message Port {
  string name = 1;    // required: desired state is keyed by stable names
  string driver = 2;
  uint32 num_rx_queues = 3;   // 0: one queue
  uint32 num_tx_queues = 4;
  uint64 rx_queue_size = 5;   // 0: driver default
  uint64 tx_queue_size = 6;
  google.protobuf.Any arg = 7;  // driver-specific argument
}

message Module {
  string name = 1;
  string mclass = 2;
  google.protobuf.Any arg = 3;  // module Init argument (module_msg.proto)
}

message Connection {
  string upstream = 1;
  uint32 ogate = 2;
  string downstream = 3;
  uint32 igate = 4;
  bool skip_default_hooks = 5;
}

message Worker {
  int32 wid = 1;
  // Unset: automatic -- a free CPU of bessd's memory node in SMT-striped
  // order (every physical core's first thread before any second), never a
  // control CPU, kept for the worker's life. A desired worker without a core
  // matches the worker of its wid wherever it runs; a core that differs from
  // where it runs replaces it (D-123). Unset no longer means CPU 0: a client
  // built from the proto before D-123 sends nothing for core 0, which is now
  // automatic -- explicit core 0 needs a client built from this proto.
  optional int32 core = 2;
  string scheduler = 3;
}

message TrafficClass {
  string name = 1;
  string parent = 2;
  string policy = 3;    // "priority", "weighted_fair", "round_robin", "rate_limit"
  string resource = 4;  // "count", "cycle", "packet", "bit"
  int32 wid = 5;        // -1: any
  optional int64 priority = 6;
  optional int64 share = 7;
  map<string, int64> limit = 8;
  map<string, int64> max_burst = 9;
  // A module's own (leaf) class is not a traffic class of desired state: its
  // placement is a TaskPlacement.
  reserved 10, 11;
  reserved "leaf_module_name", "leaf_module_taskid";
}

// Where a module's task is scheduled: under a traffic class, or at the root
// of a worker (the legacy attach_task). Exactly one of parent and wid. A task
// no entry names stays where it is; a new one goes to any worker, as the
// legacy API puts it. GetPipeline lists every task that is placed (attached,
// or waiting for a resume to attach to a given worker).
message TaskPlacement {
  string module = 1;
  uint32 task = 2;       // the module's task index; 0 for a single-task module
  string parent = 3;     // a traffic class of this pipeline
  optional int32 wid = 4;
  optional int64 priority = 5;  // required under a priority parent
  optional int64 share = 6;     // required under a weighted_fair parent
}

message Pipeline {
  repeated Port ports = 1;
  repeated Module modules = 2;
  repeated Connection connections = 3;
  repeated Worker workers = 4;
  repeated TrafficClass traffic_classes = 5;
  repeated TaskPlacement tasks = 6;
}

// -- diff and plan --------------------------------------------------------------

enum ObjectType {
  OBJECT_TYPE_UNSPECIFIED = 0;
  PORT = 1;
  MODULE = 2;
  CONNECTION = 3;
  WORKER = 4;
  TRAFFIC_CLASS = 5;
  TASK = 6;  // a module task's placement; object "module:task"
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CREATE = 1;
  REMOVE = 2;
  REPLACE = 3;        // cannot change in place: rebuilt
  UPDATE = 4;         // reattached (traffic class parent/priority/share)
  UPDATE_PARAMS = 5;  // parameters changed in place
}

message Change {
  ObjectType type = 1;
  // Object name; for a connection "upstream:ogate->downstream:igate"; for a
  // worker its wid.
  string object = 2;
  ChangeKind kind = 3;
}

message PipelineDiff {
  repeated Change changes = 1;  // unchanged objects are not listed
}

enum PlanPhase {
  PLAN_PHASE_UNSPECIFIED = 0;
  PREPARE = 1;  // side effects that need no pause and are undoable
  COMMIT = 2;   // the switch-over (may pause workers)
  RETIRE = 3;   // teardown of what was replaced, after the commit
}

message PlanStep {
  PlanPhase phase = 1;
  string operation = 2;  // e.g. "create_port", "connect", "remove_tc"
  ObjectType type = 3;
  string object = 4;
}

// -- requests and responses -----------------------------------------------------
//
// Generations count from 1 again when bessd restarts, so a generation means
// something only with the daemon epoch it was read under: every response that
// reports a generation reports that epoch too, and a mutating request names
// the epoch it was built under (D-106).

// Where a worker runs, as observed (D-123). Diagnostics, never refusals.
message WorkerPlacement {
  int32 wid = 1;
  int32 core = 2;           // the CPU it runs on, an automatic one included
  int32 numa_node = 3;      // that CPU's NUMA node
  bool cross_numa = 4;      // not bessd's memory node
  bool shares_core = 5;     // an SMT sibling of another worker's CPU or a control CPU
  bool on_control_cpu = 6;  // a CPU reserved for control threads
}

message GetPipelineRequest {}
message GetPipelineResponse {
  // The active runtime as desired state; every worker with the core it runs
  // on, an automatic one included.
  Pipeline pipeline = 1;
  uint64 generation = 2;
  uint64 daemon_epoch = 3;
  repeated WorkerPlacement workers = 4;  // observed, by wid
}

message ValidatePipelineRequest {
  Pipeline pipeline = 1;
}
message ValidatePipelineResponse {
  Pipeline normalized = 1;  // canonical form (stable order, defaults filled)
}

message DiffPipelineRequest {
  Pipeline pipeline = 1;
}
message DiffPipelineResponse {
  PipelineDiff diff = 1;
  uint64 generation = 2;  // the active generation the diff was taken against
  uint64 daemon_epoch = 3;
}

message PlanPipelineRequest {
  Pipeline pipeline = 1;
}
message PlanPipelineResponse {
  repeated PlanStep steps = 1;
  uint64 generation = 2;
  uint64 daemon_epoch = 3;
}

message ApplyPipelineRequest {
  Pipeline pipeline = 1;
  // Optimistic concurrency: rejected with ABORTED, before any side effect,
  // if the active generation differs.
  optional uint64 expected_generation = 2;
  // Required: the daemon epoch the request (and expected_generation) was
  // built under, from any earlier answer. Zero: INVALID_ARGUMENT (field
  // "daemon_epoch"); another epoch: FAILED_PRECONDITION with error detail
  // EPOCH_MISMATCH, before any side effect (D-106).
  uint64 daemon_epoch = 3;
}
message ApplyPipelineResponse {
  uint64 generation = 1;     // after the apply (unchanged for a no-op)
  uint64 applied_ops = 2;
  bool workers_paused = 3;
  uint64 validation_us = 4;
  uint64 prepare_us = 5;
  uint64 paused_commit_us = 6;
  uint64 retire_us = 7;
  uint64 daemon_epoch = 8;
}

// Carried in the "bess-error-bin" trailer of a failed call.
message ErrorDetail {
  enum Code {
    CODE_UNSPECIFIED = 0;
    INVALID_ARGUMENT = 1;
    NOT_FOUND = 2;
    ALREADY_EXISTS = 3;
    CONFLICT = 4;
    RESOURCE_BUSY = 5;
    UNSUPPORTED_TRANSACTION = 6;
    RESOURCE_FAILURE = 7;
    INTERNAL = 8;
    // The request was built under another daemon epoch (a restart since):
    // refused before any side effect; daemon_epoch is the daemon's (D-106).
    EPOCH_MISMATCH = 9;
  }
  Code code = 1;
  int32 errno_value = 2;  // errno-compatible cause, 0 if none
  string message = 3;
  string object = 4;      // offending object, when known
  string field = 5;       // offending field, when known
  uint64 daemon_epoch = 6;  // EPOCH_MISMATCH: the daemon's epoch
}

// -- Dataplane transactions (G1.2c, D-025) --------------------------------
//
// Several modules' tables changed in one call: all or nothing, per-operation
// results, dependency order worked out by bessd. A table taking part is a
// "resource" named "<module>/<table>" ("em0/rules"); its keys and values
// are typed messages of its own (ListTransactionResources names them), so
// no client packs BESS's internal keys.

message TransactionOp {
  string resource = 1;
  bool erase = 2;                   // false: add, or replace if present
  google.protobuf.Any key = 3;
  google.protobuf.Any value = 4;    // not for erase
}

message ApplyTransactionRequest {
  // How the transaction must become visible to packets (M8, D-050). Two
  // different promises, never one rounded into the other:
  //   CONSISTENCY_REFERENTIAL: operations take effect one by one, referents
  //     before referrers; a packet may see part of the transaction applied,
  //     never a reference to something missing. Any resource can take part.
  //   CONSISTENCY_SCOPE_SNAPSHOT: every scope the transaction touches
  //     switches from its whole old version to its whole new one in one
  //     store. Only resources that are scope tables can take part; if any
  //     operation names another, the call fails with UNIMPLEMENTED and error
  //     detail UNSUPPORTED_TRANSACTION (field "consistency", object the
  //     resource) and nothing is applied. It is never served as referential.
  // Unset (UNSPECIFIED) means CONSISTENCY_REFERENTIAL, which is all this
  // request could ask before the field existed.
  enum Consistency {
    CONSISTENCY_UNSPECIFIED = 0;
    CONSISTENCY_REFERENTIAL = 1;
    CONSISTENCY_SCOPE_SNAPSHOT = 2;
  }
  // Idempotency (optional but recommended): a repeated request with the
  // same id and contents returns the recorded outcome (replayed = true)
  // instead of applying again; the same id with different contents is
  // refused (ABORTED, error detail CONFLICT). Outcomes are recorded while
  // the daemon runs (a bounded, oldest-first window); use GetTransaction
  // after a timeout.
  string request_id = 1;
  // Refuse (outcome OUTCOME_CONFLICT) unless the dataplane transaction generation
  // is still this.
  optional uint64 expected_generation = 2;
  repeated TransactionOp ops = 3;
  Consistency consistency = 4;
  // Required: the daemon epoch the request (its resources and
  // expected_generation) was built under, from any earlier answer. Zero:
  // INVALID_ARGUMENT (field "daemon_epoch"); another epoch:
  // FAILED_PRECONDITION with error detail EPOCH_MISMATCH, before any side
  // effect and before the request id is looked up (D-106).
  uint64 daemon_epoch = 5;
}

message TransactionOpResult {
  // Zero is never sent: an unset status must not read as success.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_APPLIED = 1;
    STATUS_FAILED = 2;       // this operation caused the rejection; see error
    STATUS_NOT_APPLIED = 3;  // the transaction was rejected for another one
  }
  Status status = 1;
  string error = 2;
}

message TransactionRecord {
  // Zero is never sent: an unset outcome must not read as applied.
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_APPLIED = 1;
    OUTCOME_REJECTED = 2;  // an operation failed; nothing changed
    OUTCOME_CONFLICT = 3;  // expected_generation did not match; nothing tried
    // Readers slow to quiesce; nothing tried. The daemon has already waited a
    // few milliseconds (within the request's deadline) and retried: back off
    // before retrying.
    OUTCOME_BUSY = 4;
  }
  // The consistency level the transaction ran under (it describes what
  // packets could see once the transaction is APPLIED; a transaction that was
  // not applied changed nothing):
  //   VISIBILITY_DEPENDENCY_ORDERED: its operations took effect one by one,
  //     referents before referrers, and no packet saw a reference to
  //     something missing (CONSISTENCY_REFERENTIAL).
  //   VISIBILITY_SCOPE_SNAPSHOT: each scope it touched switched from its whole
  //     old version to its whole new one in one store
  //     (CONSISTENCY_SCOPE_SNAPSHOT). There is no order between two scopes.
  // VISIBILITY_ATOMIC is never sent. It named a promise ("all at once") that
  // nothing provides: the strongest guarantee is per scope, and
  // VISIBILITY_SCOPE_SNAPSHOT says so. The value stays only because removing
  // an enum value breaks `buf breaking`.
  enum Visibility {
    VISIBILITY_UNSPECIFIED = 0;
    VISIBILITY_DEPENDENCY_ORDERED = 1;
    VISIBILITY_ATOMIC = 2 [deprecated = true];
    VISIBILITY_SCOPE_SNAPSHOT = 3;
  }
  string request_id = 1;
  Outcome outcome = 2;
  uint64 generation = 3;            // dataplane generation after it
  repeated TransactionOpResult ops = 4;  // one per operation, in order
  Visibility visibility = 5;
}

message ApplyTransactionResponse {
  TransactionRecord record = 1;
  // Changes when bessd restarts: outcomes recorded under another epoch are
  // gone, so an unknown request_id then means "unknown", not "never ran".
  uint64 daemon_epoch = 2;
  bool replayed = 3;  // the recorded outcome of an earlier identical request
}

message GetTransactionRequest {
  string request_id = 1;
}

message GetTransactionResponse {
  bool known = 1;  // false: not seen under this epoch, or aged out
  TransactionRecord record = 2;
  uint64 daemon_epoch = 3;
}

message ListTransactionResourcesRequest {}

message TransactionResource {
  string name = 1;
  string key_type = 2;    // protobuf full name of the key message
  string value_type = 3;  // and of the value message
}

message ListTransactionResourcesResponse {
  repeated TransactionResource resources = 1;
  uint64 generation = 2;
  uint64 daemon_epoch = 3;
}

// -- Capabilities (M27, D-082) ---------------------------------------------
//
// What this daemon offers, for a controller to decide what to use: its version,
// the RPCs it serves (a newer client sees which are absent), the plugin API and
// the capabilities it grants, the module classes and loaded plugins, the
// ports with their queues and transmit offloads, and the transaction resources.

message GetCapabilitiesRequest {}

message PluginInfo {
  string name = 1;
  string version = 2;
  string path = 3;
  uint64 required_capabilities = 4;  // BESS_CAP_* bits (framework/plugin.h)
}

message PortInfo {
  string name = 1;
  string driver = 2;
  uint32 rx_queues = 3;
  uint32 tx_queues = 4;
  // Transmit offloads the port accepted (packet_checksum.h).
  bool tx_ipv4_checksum = 5;
  bool tx_udp_checksum = 6;
  bool tx_tcp_checksum = 7;
  bool tx_outer_ipv4_checksum = 8;
  bool tx_outer_udp_checksum = 9;
  bool tx_multi_segment = 10;
  // Receive steering (TP8): both directions of a connection reach the same
  // queue (trivially with one queue), and what decides the queue (equal on
  // two ports: the same tuple lands on the same queue index; 0: unknown).
  bool symmetric_rss = 11;
  uint64 rss_signature = 12;
}

message GetCapabilitiesResponse {
  string daemon_version = 1;
  repeated string rpcs = 2;  // full names, e.g. bess.pb.v2.Control/ApplyTransaction
  uint32 plugin_api_version = 3;
  uint64 plugin_capabilities = 4;  // BESS_CAP_* a plugin may require
  repeated string module_classes = 5;
  repeated PluginInfo plugins = 6;
  repeated PortInfo ports = 7;
  repeated TransactionResource resources = 8;
  uint64 daemon_epoch = 9;
  // Process placement (D-123): the one-line summary bessd logged at startup
  // ("placement: node N (candidates ..., reason ...), control CPUs X, worker
  // CPUs available Y") and the memory node every allocation uses.
  string placement = 10;
  int32 memory_node = 11;
  // SIMD width (D-126): the summary bessd logged at startup ("simd: width W
  // (requested R; CPU C, DPDK default D)"); W, the widest vectors BESS's own
  // kernels use, in bits; and DPDK's limit as DPDK reports it after EAL
  // initialization (rte_vect_get_max_simd_bitwidth(); 32768: unlimited, as on
  // arm64). On x86 the two are equal; on arm64 DPDK keeps its default.
  string simd = 12;
  uint32 simd_width = 13;
  uint32 dpdk_simd_width = 14;
}

// -- Schema discovery (D-105) ---------------------------------------------
//
// What a generic client (bessctl, a manifest tool, a UI) needs to read and
// write module, driver and resource arguments without generated code: each
// module class's and port driver's init argument type, each module command's
// argument type, and the descriptors of all of them (with transaction
// resources' key and value types). Plugins' types are included once loaded.
// Type names are full protobuf names ("bess.pb.ExactMatchArg"); "" where the
// class did not declare one (a class registered without DEF_MODULE /
// ADD_DRIVER), or where a command's declared type does not resolve: it is
// tried as a full name, then in the package of its class's init type, then in
// bess.pb (docs/plugin-api.md).

message GetSchemaRequest {}

message CommandSchema {
  string name = 1;
  string arg_type = 2;
  bool thread_safe = 3;  // runs without pausing workers
}

message ModuleClassSchema {
  string name = 1;
  string help = 2;
  string init_arg_type = 3;
  uint32 igates = 4;  // input gates the class accepts
  uint32 ogates = 5;  // output gates
  repeated CommandSchema commands = 6;
}

message PortDriverSchema {
  string name = 1;
  string help = 2;
  string init_arg_type = 3;
}

message GetSchemaResponse {
  repeated ModuleClassSchema module_classes = 1;  // sorted by name
  repeated PortDriverSchema port_drivers = 2;     // sorted by name
  // Every file that defines a type named above or by a transaction resource,
  // with all their imports, each after the files it imports: building them
  // in order into an empty pool succeeds.
  google.protobuf.FileDescriptorSet descriptors = 3;
  uint64 daemon_epoch = 4;
}

// -- Operational events (M25 phase 2, D-084) -----------------------------
//
// Pushed: control-plane observations, never per-packet logs. A stream starts
// at `from_sequence` (0: the next event). Stream-control events, all with
// source "bessd": "bess.start" first (its sequence is where the stream starts,
// with the daemon_epoch); "bess.restart" before it when the caller's sequence
// or epoch is from before a restart (the stream then starts live);
// "bess.gap" when what was asked for is older than the daemon still holds;
// "bess.progress" (with a types filter) carrying the last sequence passed
// over, so a reconnect resumes there. Sequences restart with the daemon.

message WatchEventsRequest {
  uint64 from_sequence = 1;
  repeated string types = 2;  // only these types (empty: all; gaps always)
  // The epoch `from_sequence` belongs to (0: any). Another epoch: the daemon
  // restarted and its sequences began again, so the stream starts with one
  // "bess.restart" event and continues from the next event.
  uint64 daemon_epoch = 3;
}

message Event {
  uint64 sequence = 1;
  uint64 daemon_epoch = 2;
  uint64 time_ns = 3;  // monotonic clock
  string type = 4;     // "bess.transaction", "bess.gap", a module's own
  string source = 5;
  uint64 generation = 6;
  map<string, string> fields = 7;
  // "bess.gap": events [gap_from, gap_to) are no longer held.
  uint64 gap_from = 8;
  uint64 gap_to = 9;
}

// -- Operational metrics (M25, D-076) ------------------------------------
//
// Pulled: each call reads every registered source (the runtime's RCU and
// transaction engine, and whatever modules registered). Names follow
// Prometheus conventions (`bess_` prefix, counters end in `_total`), so an
// exporter can pass them through (tools/bess_prometheus.py).

message ListMetricsRequest {}

message MetricSample {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_COUNTER = 1;  // monotonic while the daemon runs
    KIND_GAUGE = 2;
  }
  string name = 1;
  Kind kind = 2;
  string help = 3;
  map<string, string> labels = 4;
  double value = 5;
}

message ListMetricsResponse {
  repeated MetricSample samples = 1;  // sorted by name, then labels
  uint64 daemon_epoch = 2;            // counters restart with the daemon
}

// -- Module commands (D-115) -----------------------------------------------
//
// A module's command, as GetSchema lists it (name, argument type,
// thread_safe): what a module does besides its desired state -- lookups,
// statistics, one-shot operations -- and the edits of its tables beside its
// transaction resources. Not transactional: a command acts when it runs. A
// command not marked thread_safe is refused while a worker runs
// (FAILED_PRECONDITION, RESOURCE_BUSY, errno EBUSY): pause the workers first
// (Admin.PauseWorkers). A command's failure is the call's error, with the
// command's errno in ErrorDetail.errno_value.
message RunModuleCommandRequest {
  uint64 daemon_epoch = 1;  // required (D-106)
  string module = 2;
  string command = 3;
  google.protobuf.Any arg = 4;  // the command's argument type
}

message RunModuleCommandResponse {
  google.protobuf.Any data = 1;  // the command's answer; unset when it has none
  uint64 daemon_epoch = 2;
}

service Control {
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse) {}
  rpc ValidatePipeline(ValidatePipelineRequest)
      returns (ValidatePipelineResponse) {}
  rpc DiffPipeline(DiffPipelineRequest) returns (DiffPipelineResponse) {}
  rpc PlanPipeline(PlanPipelineRequest) returns (PlanPipelineResponse) {}
  rpc ApplyPipeline(ApplyPipelineRequest) returns (ApplyPipelineResponse) {}

  rpc ApplyTransaction(ApplyTransactionRequest)
      returns (ApplyTransactionResponse) {}
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {}
  rpc ListMetrics(ListMetricsRequest) returns (ListMetricsResponse) {}
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse) {}
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse) {}
  rpc WatchEvents(WatchEventsRequest) returns (stream Event) {}
  rpc ListTransactionResources(ListTransactionResourcesRequest)
      returns (ListTransactionResourcesResponse) {}
  rpc RunModuleCommand(RunModuleCommandRequest)
      returns (RunModuleCommandResponse) {}
}

// -- Administration (D-107) ----------------------------------------------
//
// What an operator does to a running daemon besides its pipeline: plugins,
// port status, packet capture, packet pools, pausing and resuming the
// workers, and shutdown. Like Control's
// mutating calls, Admin's name the daemon epoch they were built under
// (D-106) and are refused under another, before any side effect.

message ImportPluginRequest {
  string path = 1;  // a shared object, as the daemon's host sees it
  uint64 daemon_epoch = 2;
}
message ImportPluginResponse {
  uint64 daemon_epoch = 1;
}

message UnloadPluginRequest {
  string path = 1;  // as it was imported
  uint64 daemon_epoch = 2;
}
message UnloadPluginResponse {
  uint64 daemon_epoch = 1;
}

message GetPortStatusRequest {
  repeated string names = 1;  // empty: every port; an unknown name is NOT_FOUND
}

message PortStatus {
  message Link {
    bool up = 1;
    uint32 speed_mbps = 2;  // 0: unknown
    bool full_duplex = 3;
    bool autoneg = 4;
  }
  // Counters since the port was created (packets that reached or left the
  // port's queues, as the port counts them).
  message Counters {
    uint64 packets = 1;
    uint64 bytes = 2;
    uint64 dropped = 3;
    uint64 prepare_errors = 4;  // transmit only: packets the PMD's prepare refused
  }
  string name = 1;
  string driver = 2;
  Link link = 3;
  Counters rx = 4;
  Counters tx = 5;
  // The device's NUMA node as DPDK reports it; -1: unknown (D-123).
  int32 numa_node = 6;
  // On a node other than bessd's memory node: diagnosed, never refused.
  bool cross_numa = 7;
}

message GetPortStatusResponse {
  repeated PortStatus ports = 1;  // in request order, else by name
  uint64 daemon_epoch = 2;
}

message GetPacketPoolsRequest {}

// The default packet pool: one, on the memory node (D-123).
message PacketPool {
  uint32 socket = 1;
  uint32 size = 2;        // packets the pool holds
  uint32 cache_size = 3;  // per-core cache, packets
  uint32 element_size = 4;
  uint32 populated = 5;
  uint32 available = 6;
  uint32 in_use = 7;
}

message GetPacketPoolsResponse {
  repeated PacketPool pools = 1;  // the default pool (one entry)
  uint64 daemon_epoch = 2;
}

// Packet capture on a module's gates into a FIFO (or file) the caller
// opened: libpcap or pcapng records, which tcpdump and wireshark read. The
// daemon writes; the caller owns the path and its reader, which must exist.
// A gate has at most one capture of each format: starting a second is
// ALREADY_EXISTS, and on every gate it is all or nothing.
message SetCaptureRequest {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_INPUT = 1;   // input gates: packets arriving at the module
    DIRECTION_OUTPUT = 2;  // output gates: packets the module sends on
  }
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    FORMAT_PCAP = 1;
    FORMAT_PCAPNG = 2;  // with each packet's metadata attributes
  }
  string module = 1;
  Direction direction = 2;
  // Unset: every gate of that direction. A pcap stream holds one file
  // header, so pcap without a gate needs the module to have exactly one gate
  // in that direction (else INVALID_ARGUMENT); pcapng has a section per gate.
  optional uint32 gate = 3;
  Format format = 4;
  string fifo = 5;           // required to start; ignored to stop
  bool enable = 6;           // false: stop this format's capture there
  uint64 daemon_epoch = 7;
}

message SetCaptureResponse {
  uint64 daemon_epoch = 1;
}

// Every worker. A worker the pipeline creates starts paused, as in the
// legacy API; resuming runs the resume hooks (metadata offsets, PreResume
// module events) first. Applying a pipeline keeps the workers' state.
message PauseWorkersRequest {
  uint64 daemon_epoch = 1;
}
message PauseWorkersResponse {
  uint64 daemon_epoch = 1;
}
message ResumeWorkersRequest {
  uint64 daemon_epoch = 1;
}
message ResumeWorkersResponse {
  uint64 daemon_epoch = 1;
}

message ShutdownRequest {
  uint64 daemon_epoch = 1;
}
// Sent before the daemon stops serving; it then stops its workers and exits.
message ShutdownResponse {
  uint64 daemon_epoch = 1;
}

service Admin {
  rpc ImportPlugin(ImportPluginRequest) returns (ImportPluginResponse) {}
  rpc UnloadPlugin(UnloadPluginRequest) returns (UnloadPluginResponse) {}
  rpc GetPortStatus(GetPortStatusRequest) returns (GetPortStatusResponse) {}
  rpc GetPacketPools(GetPacketPoolsRequest) returns (GetPacketPoolsResponse) {}
  rpc SetCapture(SetCaptureRequest) returns (SetCaptureResponse) {}
  rpc PauseWorkers(PauseWorkersRequest) returns (PauseWorkersResponse) {}
  rpc ResumeWorkers(ResumeWorkersRequest) returns (ResumeWorkersResponse) {}
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse) {}
}
