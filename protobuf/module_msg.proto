syntax = "proto3";

package bess.pb;
import "util_msg.proto";

// Module-specific messages.
// The header generated from this file should not be included in the BESS core
// source code.

// For your comments to come out in the auto-documentation:
// Format comments with two stars at the top, or use three slashes (///)
// Anything you write will show up as markdown, so feel free to add italics, etc.

/// The module_msg.proto file is stored in `bess/protobuf/` and it supplies the glue between
/// bessd modules and the outside world via GRPC.
/// bessctl uses GRPC to update modules. Whenever you call a function in bessctl, a corresponding function
/// is called on modules in bessd. This file lists all modules, their initialization parameters
/// and any functions that may be called on them.

message EmptyArg {
}

/**
 * FlowGen's run-time settings (D-129): the singleton resource
 * "<module>/settings", requiring paused workers. It holds what `update`
 * (FlowGenArg's updatable fields) and `set_burst` set, validated as they
 * validate. As for `update`, an unset field (empty template or
 * distribution, zero rate, no burst) keeps the current value; the read-back
 * (canonical) form names every field, so a manifest should too. The template
 * may not change between UDP and TCP.
 */
message FlowGenSettings {
  bytes template = 1; /// The packet template (IPv4 UDP or TCP), as FlowGenArg.template.
  double pps = 2; /// Packets per second, as FlowGenArg.pps.
  double flow_rate = 3; /// New flows per second (<= pps), as FlowGenArg.flow_rate.
  double flow_duration = 4; /// Flow lifetime in seconds, as FlowGenArg.flow_duration.
  string arrival = 5; /// "uniform" or "exponential".
  string duration = 6; /// "uniform" or "pareto".
  optional uint64 burst = 7; /// Packets per batch, at most 32 (set_burst).
}

/**
 * The HashLB module has a command `set_mode(...)` which takes two parameters.
 * The `mode` parameter specifies whether the load balancer will hash over the
 * src/dest ethernet header (`'l2'`), over the src/dest IP addresses (`'l3'`), or over
 * the flow 5-tuple (`'l4'`).  Alternatively, if the `fields` parameter is set, the
 * load balancer will hash over the N-tuple with the specified offsets and
 * sizes.
 * Example use in bessctl: `lb.set_mode('l2')`
 */
message HashLBCommandSetModeArg {
  string mode = 1; /// What fields to hash over, `'l2'`, `'l3'`, and `'l4'` are only valid values.
  repeated Field fields = 2; /// A list of fields that define a custom tuple.
}

/**
 * The HashLB module has a command `set_gates(...)` which takes one parameter.
 * This function takes in a list of gate numbers to send hashed traffic out over.
 * Example use in bessctl: `lb.setGates(gates=[0,1,2,3])`
 */
message HashLBCommandSetGatesArg {
  repeated int64 gates = 1; ///A list of gate numbers to load balance traffic over
}

/**
 * HashLB's run-time settings (D-129): the singleton resource
 * "<module>/settings", applied live (an RCU-published configuration). mode
 * and fields are what set_mode sets (fields, when given, override mode; mode
 * is otherwise one of 'l2', 'l3', 'l4'); gates is what set_gates sets (at
 * least one, each a valid gate). Read back as last set.
 */
message HashLBSettings {
  string mode = 1; /// 'l2', 'l3' or 'l4' (ignored when fields are given).
  repeated Field fields = 2; /// A custom tuple to hash over.
  repeated int64 gates = 3; /// The gates to load balance over.
}

/**
 * The L2Forward module has a function `lookup(...)` to query what output gate
 * a given MAC address will be forwared to; it returns the gate ID number.
 */
message L2ForwardCommandLookupArg {
  repeated string addrs = 1; /// The MAC address to query for
}

/**
 * This message type provides the reponse to the L2Forward function `lookup(..)`.
 * It returns the gate that a requested MAC address is currently assigned to.
 */
message L2ForwardCommandLookupResponse {
  repeated uint64 gates = 1; /// The gate ID that the requested MAC address maps to
}

/**
 * The L2Forward module has a command `populate(...)` which allows for fast creation
 * of the forwarding table given a range of MAC addresses. The function takes in a
 * 'base' MAC address, a count (number of MAC addresses), and a gate_id. The module
 * will route all MAC addresses starting from the base address, up to base+count address
 * round-robin over gate_count total gates.
 * For example, `populate(base='11:22:33:44:00', count = 10, gate_count = 2)` would
 * route addresses `11:22:33:44::(00, 02, 04, 06, 08)` out a gate 0 and the odd-suffixed
 * addresses out gate 1.
 */
message L2ForwardCommandPopulateArg {
  string base = 1; /// The base MAC address
  int64 count = 2; /// How many addresses beyond base to populate into the routing table
  int64 gate_count = 3; /// How many gates to create in the L2Forward module.
}

/**
 * The Measure module measures and collects latency/jitter data for packets
 * annotated by a Timestamp module. Note that Timestamp and Measure module must reside
 * on the server for accurate measurement (as a result, the most typical use case is
 * measuring roundtrip time).
 * Optionally, you can also retrieve percentile values by specifying points in
 * "percentiles". For example, "percentiles" of [50.0, 99.0] will return
 * [median, 99'th %-ile tail latency] in "percentile_values_ns" in the response.
 */
message MeasureCommandGetSummaryArg {
  bool clear = 1; /// if true, the data will be all cleared after read
  repeated double latency_percentiles = 2; /// ascending list of real numbers in [0.0, 100.0]
  repeated double jitter_percentiles = 3; /// ascending list of real numbers in [0.0, 100.0]
}

/**
 * The Measure module function `get_summary()` returns the following values.
 * Note that the resolution value tells you how grainy the samples are,
 * e.g., 100 means that anything from 0-99 ns counts as "0",
 * anything from 100-199 counts as "100", and so on.  The average
 * is of samples using this graininess, but (being a result of division)
 * may not be a multiple of the resolution.
 */
message MeasureCommandGetSummaryResponse {
  message Histogram {
    uint64 count = 1; /// Total # of measured data points, including above_range
    uint64 above_range = 2; /// # of data points for the "too large value" bucket
    uint64 resolution_ns = 8; /// resolution of measured data
    uint64 min_ns = 3;
    uint64 avg_ns = 4;
    uint64 max_ns = 5;
    uint64 total_ns = 6;
    repeated uint64 percentile_values_ns = 7;
  }

  double timestamp = 1; /// Seconds since boot.
  uint64 packets = 2; /// Total # of packets seen by this module.
  uint64 bits = 3; /// Total # of bits seen by this module.
  Histogram latency = 4;
  Histogram jitter = 5;
}


/**
 * The Module DRR provides fair scheduling of flows based on a quantum which is
 * number of bytes allocated to each flow on each round of going through all flows.
 * Examples can be found [./bessctl/conf/samples/drr.yaml]
 *
 * __Input_Gates__: 1
 * __Output_Gates__:  1
 */
message DRRArg {
  uint32 num_flows = 1;  /// Number of flows to handle in module
  uint64 quantum = 2;  /// the number of bytes to allocate to each on every round
  uint32 max_flow_queue_size = 3; /// the max size that any Flows queue can get
}

/**
 * DRR's run-time settings (D-129): the singleton resource
 * "<module>/settings", applied live. quantum is what set_quantum_size sets,
 * max_flow_queue_size what set_max_flow_queue_size sets; both at least 1.
 */
message DRRSettings {
  uint32 quantum = 1; /// Bytes allocated to each flow on every round.
  uint32 max_flow_queue_size = 2; /// The max size that any flow's queue can get.
}

/**
 * PortInc's run-time settings (D-129): the singleton resource
 * "<module>/settings", applied live: what set_burst sets.
 */
message PortIncSettings {
  uint64 burst = 1; /// Packets per batch, at most 32.
}

/**
 * QueueInc's run-time settings (D-129): the singleton resource
 * "<module>/settings", applied live: what set_burst sets.
 */
message QueueIncSettings {
  uint64 burst = 1; /// Packets per batch, at most 32.
}

/**
 * Modules that are queues or contain queues may contain functions
 * `get_status()` that return QueueCommandGetStatusResponse.
 */
message QueueCommandGetStatusArg {}

/**
 * Modules that are queues or contain queues may contain functions
 * `get_status()` that take no parameters and returns the queue occupancy and
 * size.
 */
message QueueCommandGetStatusResponse {
  uint64 count = 1;    /// The number of packets currently in the queue.
  uint64 size = 2;     /// The maximum number of packets the queue can contain.
  uint64 enqueued = 3; /// total enqueued
  uint64 dequeued = 4; /// total dequeued
  uint64 dropped = 5;  /// total dropped
}

/**
 * The module WildcardMatch has a command `add(...)` which inserts a new rule
 * into the WildcardMatch module. For an example of code using WilcardMatch see
 * `bessctl/conf/samples/wildcardmatch.yaml`.
 */
/**
 * Transactional rule keys and values (G1.2c, D-025): ExactMatch's resource
 * "<module>/rules" takes ExactMatchRuleKey / ExactMatchRuleValue, and
 * WildcardMatch's WildcardMatchRuleKey / WildcardMatchRuleValue, in
 * bess.pb.v2.ApplyTransaction. Fields as in the add/delete commands.
 */
// One placement of a rule's result record: num_bytes bytes starting at
// value_offset in the rule's `result`, written to a metadata attribute
// (attr_name) or a packet byte offset. A table's record is as wide as its
// widest field; a shorter rule result is zero-padded, so an unwritten byte
// reads zero rather than stale data. A hit whose packet is too short for a
// packet destination is dropped; a miss places `default_result` if the
// application set one, and writes nothing otherwise.
message ResultField {
  oneof destination {
    string attr_name = 1;  // the metadata attribute to write
    uint32 offset = 2;     // the packet byte offset to write
  }
  uint32 value_offset = 3;  // the field's start in the result record
  uint32 num_bytes = 4;
  // The resource this field's bytes name (e.g. "rt/next_hops"), so the
  // transaction engine orders a rule after the entries it references and
  // refuses their erase while the rule remains. An all-zero field references
  // nothing. Placement never checks a reference: the packet path writes the
  // bytes it already validated.
  string reference = 5;
  // How those bytes name the entry's key. RAW: the bytes are the key.
  // BE32: the field is a 32-bit big-endian id (the metadata convention) and
  // the key is the host-order uint32, as StrongId resources encode it.
  enum ReferenceKey {
    RAW = 0;
    BE32 = 1;
  }
  ReferenceKey reference_key = 6;
  // For a BE32 reference: how many consecutive 4-byte big-endian ids the
  // field carries (unset or 0 means one), so an 8-byte meter_id names two
  // meter levels and each id is a separate reference. num_bytes must be
  // 4 * reference_count. A RAW reference always carries one key.
  uint32 reference_count = 7;
}

message ExactMatchRuleKey {
  repeated FieldData fields = 1;
}

message ExactMatchRuleValue {
  // The output gate a matching packet leaves on.
  uint64 gate = 1;
  // The rule's result record, placed by the module's result_fields. Shorter
  // than the table's record size: the rest is zeros. Longer: refused.
  bytes result = 3;
}

message MeterIdKey {
  uint32 id = 1;
}

message SrTcmProfile {
  uint64 committed_rate = 1;
  uint64 committed_burst = 2;
  uint64 excess_burst = 3;
}

message TrTcmProfile {
  uint64 committed_rate = 1;
  uint64 committed_burst = 2;
  uint64 peak_rate = 3;
  uint64 peak_burst = 4;
}

message TrTcmRfc4115Profile {
  uint64 committed_rate = 1;
  uint64 committed_burst = 2;
  uint64 excess_rate = 3;
  uint64 excess_burst = 4;
}

message MeterPolicyValue {
  oneof profile {
    SrTcmProfile sr_tcm = 1;
    TrTcmProfile tr_tcm = 2;
    TrTcmRfc4115Profile tr_tcm_rfc4115 = 3;
  }
}

message RouterNextHopIdKey {
  uint32 id = 1;
}

enum RouterNeighborState {
  ROUTER_NEIGHBOR_STATE_UNSPECIFIED = 0;
  ROUTER_NEIGHBOR_STATE_RESOLVED = 1;
  ROUTER_NEIGHBOR_STATE_INCOMPLETE = 2;
  ROUTER_NEIGHBOR_STATE_UNREACHABLE = 3;
}

/**
 * What a Router next hop does with a packet (D-178): forward it out the egress
 * gate, or deliver it to this node (a local route). Unset means forward, which
 * keeps every value written before local delivery existed meaning the same.
 */
enum RouterNextHopKind {
  ROUTER_NEXT_HOP_KIND_UNSPECIFIED = 0;
  ROUTER_NEXT_HOP_KIND_FORWARD = 1;
  ROUTER_NEXT_HOP_KIND_LOCAL = 2;
}

/**
 * A Router next hop ("<module>/next_hops"). An unset neighbor means resolved
 * and an absent MAC the zero address; the resource reads back (D-129) with
 * the neighbor always set and a zero MAC absent, so desired state that sends
 * that form applies as a no-op. A local hop takes kind LOCAL, no egress
 * (DROP_GATE) and no MACs; it delivers to this node instead of forwarding
 * (D-178).
 */
message RouterNextHopValue {
  uint32 egress_gate = 1;
  RouterNeighborState neighbor = 2;
  bytes dst_mac = 3;
  bytes src_mac = 4;
  RouterNextHopKind kind = 5;
}

/**
 * A Router next hop's availability ("<module>/next_hop_state", D-184), keyed
 * by RouterNextHopIdKey: the input a path-health producer (BFD, ICMP or
 * application probes, a controller) writes, for a static next hop or one bound
 * to a neighbor alike. A next hop with no entry is available. An entry
 * references its next hop (a bound one's binding in "<module>/neighbors"):
 * state for a next hop that does not exist is refused, and a next hop with an
 * entry cannot be erased or unbound without it. Marking a next hop down
 * republishes every group it is a member of, so routes through those groups,
 * IPv4 and IPv6, move to their other members. Reads back as written (D-129),
 * an entry that says available included.
 */
message RouterNextHopState {
  bool down = 1;
}

/**
 * The key of a Router's "<module>/groups" resource (D-129, D-156): a next-hop
 * group id, 1..max_groups.
 */
message RouterGroupIdKey {
  uint32 id = 1;
}

/**
 * A Router next-hop group ("<module>/groups", D-065, D-156, D-184): the
 * member next hops a route naming the group selects among. `member_ids` are
 * the active members and `standby_member_ids` the standby ones, each list in
 * selection order: 1..64 next hops in all, at least one active, a repeated
 * member a weight (it takes that many selection slots), and no next hop in
 * both lists. A flow uses the available actives; with every active down
 * ("<module>/next_hop_state") the available standbys; with everything down
 * the actives. A member must exist and a route naming the group references
 * it: the engine refuses a member or a group still in use. Reads back in
 * exactly this form (D-129), members in their stored order.
 */
message RouterGroupValue {
  repeated uint32 member_ids = 1;
  repeated uint32 standby_member_ids = 2;
}

/** A route's prefix. Exactly one of ipv4 or ipv6 is set. */
message RouterRouteKey {
  string ipv4 = 1; /// IPv4 prefix address, e.g. "198.51.100.0".
  uint32 prefix_length = 2; /// Prefix length: 0..32 for ipv4, 0..128 for ipv6.
  uint32 domain = 3; /// Route domain (default 0); must be below the router's max_domains.
  string ipv6 = 4; /// IPv6 prefix address, e.g. "2001:db8::".
}

/**
 * A route's target: a next hop, or the group whose member the flow hash
 * picks. Ids are one-based, so 0 -- the default -- names nothing, and a route
 * names exactly one of the two: the codec refuses a value that names both or
 * neither (D-156). `next_hop_id` keeps its number and its meaning, so a route
 * written for a hop reads back unchanged (D-129).
 */
message RouterRouteValue {
  uint32 next_hop_id = 1; /// The next hop the route forwards to (0: not that).
  uint32 group_id = 2; /// The group the route forwards through (0: not that; needs max_groups).
}

/**
 * One of the router's own L3 interfaces: the MAC and addresses its neighbor
 * solicitations come from, and the output gate they leave through.
 */
message RouterInterface {
  uint32 id = 1; /// Interface id: must equal egress_gate + 1, or 0 to derive it. The ingress interface attribute carries the same id.
  uint32 egress_gate = 2; /// Router output gate this interface transmits on.
  string mac_addr = 3; /// Local Ethernet address, "aa:bb:cc:dd:ee:ff"; nonzero.
  repeated string addresses = 4; /// The interface's own addresses with their on-link prefix lengths, e.g. "192.0.2.1/24" or "2001:db8::1/64": at least one, any number of either family (in ROUTE_MODE_DESTINATION, of an enabled family). The families configured here select the neighbor protocols read: ARP for IPv4, Neighbor Discovery for IPv6. A solicitation leaves from the address whose prefix holds the neighbor, else from the first address of its family.
}

/**
 * A Router neighbor binding ("<module>/neighbors", keyed by
 * RouterNextHopIdKey, D-183): the next-hop id the key names is bound to a
 * neighbor on one of the router's interfaces, and the router resolves its
 * MAC (ARP for IPv4, Neighbor Discovery for IPv6). Binding publishes the hop,
 * incomplete, at once; routes and groups name it like any next hop, and an
 * unbind is refused while any does. An id is bound or static
 * ("<module>/next_hops"), never both. Exactly one of ipv4 or ipv6 is set.
 * Reads back in exactly this form, addresses in canonical text (D-129).
 */
message RouterNeighborBinding {
  uint32 interface_id = 1; /// The RouterInterface the neighbor is on.
  string ipv4 = 2; /// Neighbor IPv4 address (resolved with ARP).
  string ipv6 = 3; /// Neighbor IPv6 address (resolved with Neighbor Discovery).
}

/**
 * One binding of "<module>/neighbors" as neighbor resolution sees it (the
 * Router's get_neighbors action, D-183). A neighbor the resolver does not
 * know yet -- bound since the last maintenance tick -- is incomplete with no
 * probes.
 */
message RouterNeighborStatus {
  uint32 next_hop_id = 1; /// The bound next-hop id.
  uint32 interface_id = 2; /// The RouterInterface the neighbor is on.
  string ipv4 = 3; /// Neighbor IPv4 address, when it is one.
  string ipv6 = 4; /// Neighbor IPv6 address, when it is one.
  RouterNeighborState state = 5; /// Resolved, incomplete or unreachable; never unspecified.
  string mac_addr = 6; /// The neighbor's learned MAC, "aa:bb:cc:dd:ee:ff"; empty until one is learned.
  bool reconfirming = 7; /// A resolved neighbor whose reachable lifetime ran out, being probed while it still forwards.
  uint32 probes = 8; /// Solicitations sent in the current attempt.
}

/** The Router's get_neighbors action (EmptyArg): every binding, in id order. */
message RouterCommandGetNeighborsResponse {
  repeated RouterNeighborStatus neighbors = 1;
}

/**
 * An inclusive range on one of a WildcardMatch's fields (D-186): the field's
 * bytes, read as a big-endian unsigned integer of the field's size, lie in
 * [low, high]. The field's mask must be all zero (the range replaces it); a
 * range costs no tuple. A rule names a field at most once, low <= high, and
 * high fits the field; a range over the field's whole domain is dropped (the
 * rule is the one without it), and low == high stays a range.
 */
message WildcardMatchFieldRange {
  uint32 field = 1; /// 0-based index into the module's `fields`.
  uint64 low = 2;   /// Inclusive lower bound.
  uint64 high = 3;  /// Inclusive upper bound.
}

// A rule is (values, masks, ranges): rules with the same values and masks and
// different ranges are different rules.
message WildcardMatchRuleKey {
  repeated FieldData values = 1;
  repeated FieldData masks = 2;
  repeated WildcardMatchFieldRange ranges = 3;
}

message WildcardMatchRuleValue {
  int64 priority = 1;
  // The output gate a matching packet leaves on.
  uint64 gate = 2;
  // The rule's result record, placed by the module's result_fields. Shorter
  // than the table's record size: the rest is zeros. Longer: refused.
  bytes result = 4;
}

message WildcardMatchCommandAddArg {
  uint64 gate = 1; /// Traffic matching this new rule will be sent to this gate.
  int64 priority = 2; ///If a packet matches multiple rules, the rule with higher priority will be applied. If priorities are equal behavior is undefined.
  repeated FieldData values = 3; /// The values to check for in each field.
  repeated FieldData masks = 4; /// The bitmask for each field -- set `0x0` to ignore the field altogether.
  repeated WildcardMatchFieldRange ranges = 5; /// Inclusive per-field ranges, as in WildcardMatchRuleKey.
}

/**
 * WildcardMatch's run-time settings, the singleton resource
 * "<module>/settings" (D-129): what `set_default_gate(...)` sets.
 */
message WildcardMatchSettings {
  uint64 default_gate = 1; /// The gate for traffic that matches no rule.
}

/**
 * The module ACL creates an access control module: the rules are checked in
 * order, the first rule that matches a packet forwards or drops it, and a
 * packet that no rule matches is dropped.
 * Examples of ACL can be found in [`bessctl/conf/samples/acl.yaml`](./bessctl/conf/samples/acl.yaml)
 *
 * A rule constrains only the fields it names. A packet's addresses and ports
 * come from the checked parse (core/packet_parse.h, D-188): IPv4, untagged or
 * behind up to two VLAN tags, with options. The ports are those of TCP and
 * UDP; ICMP, other protocols and a non-first fragment are judged with ports
 * 0, which only a rule with wildcard ports matches. A rule whose four fields
 * are all wildcards ("" or a /0 prefix, port 0) matches every packet, IPv4 or
 * not; any other rule matches only IPv4. So a packet that is not IPv4 (ARP,
 * IPv6, ...) takes the first all-wildcard rule, or is dropped when there is
 * none. A packet whose headers do not fit its first segment or lie about
 * their lengths is dropped before any rule, even an all-wildcard one.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message ACLArg {
  /**
   * One ACL rule is represented by the following 6-tuple.
   */
  message Rule {
    string src_ip = 1;    /// Source IP block in CIDR. Wildcard if "".
    string dst_ip = 2;    /// Destination IP block in CIDR. Wildcard if "".
    uint32 src_port = 3;  /// TCP/UDP source port. Wildcard if 0.
    uint32 dst_port = 4;  /// TCP/UDP Destination port. Wildcard if 0.
    bool established = 5; /// Not implemented
    bool drop = 6;        /// Drop matched packets if true, forward if false. A packet no rule matches is dropped.
  }
  repeated Rule rules = 1; ///A list of ACL rules.
}

/**
 * A firewall: a priority-ordered policy over the 5-tuple, with port ranges.
 *
 * The policy is the "<name>/rules" resource (FirewallRuleKey ->
 * FirewallRuleValue, D-179): each rule has a stable id, and the rules are
 * checked by priority, highest first, equal priorities by id, lowest first.
 * The first matching rule wins, a matching rule that does not drop forwards,
 * and a packet no rule matches is dropped. Port ranges are first-class: a
 * range is two bounds, not a set of masks, so a wide range costs the table
 * nothing (see core/classifier/firewall_table.h).
 *
 * A packet's 5-tuple comes from the checked parse ConnTrack, NAT and the
 * Router read (core/packet_parse.h, D-188): up to two VLAN tags, IPv4
 * options, up to eight IPv6 extension headers (AH included). A packet that is
 * not IP or is malformed is dropped, even by a catch-all rule; a later
 * fragment, ICMP and protocols other than TCP and UDP are judged with both
 * ports 0.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1 (the incoming gate)
 */
message FirewallArg {
  message Rule {
    string src_ip = 1;         /// Source prefix in CIDR. Wildcard if "".
    string dst_ip = 2;         /// Destination prefix in CIDR. Wildcard if "".
    uint32 proto = 3;          /// IP protocol number. Wildcard if 0.
    uint32 src_port_low = 4;   /// Inclusive lower bound (default 0).
    optional uint32 src_port_high = 5; /// Inclusive upper bound (default 65535).
    uint32 dst_port_low = 6;   /// Inclusive lower bound (default 0).
    optional uint32 dst_port_high = 7; /// Inclusive upper bound (default 65535).
    bool drop = 8;             /// Drop matching packets instead of forwarding.
    optional uint32 action_id = 9; /// The action id a matching packet carries, 0 for none. The packet path writes it into the packet's "action_id" metadata attribute for whatever module downstream reads it (D-141). A rule that drops cannot name one.
  }
  repeated Rule rules = 1; /// The initial policy, in order: rule i becomes "<name>/rules" id i + 1 at priority 0.
  string action_attr = 2; /// The metadata attribute a matching rule's action id is written to (default "action_id"). The reader must be configured with the same name; with no reader the packets carry no action id (PreResume reports it once).
}

/**
 * A Firewall rule's key in "<name>/rules": an id the controller chooses. It
 * names the rule across updates; it does not order it (D-179).
 */
message FirewallRuleKey {
  uint32 id = 1;
}

/**
 * A Firewall rule's value in "<name>/rules": where it stands and what it
 * matches. Higher priority is checked first; equal priorities go by id,
 * lowest first (D-179).
 */
message FirewallRuleValue {
  int64 priority = 1;
  FirewallArg.Rule rule = 2;  // required; a catch-all is the empty rule {}
}

/**
 * The BPF module is an access control module that sends packets out on a particular gate based on whether they match a BPF filter.
 *
 * __Input Gates__: 1
 * __Output Gates__: many (configurable)
 */
message BPFArg {
  /**
   * One BPF filter is represented by the following 3-tuple.
   */
  message Filter {
    int64 priority = 1; /// The priority level for this rule. If a packet matches multiple rules, it will be forwarded out the gate with the highest priority. If a packet matches multiple rules with the same priority, the behavior is undefined.
    string filter = 2; /// The actual BPF string.
    int64 gate = 3; ///What gate to forward packets that match this BPF to.
  }
  repeated Filter filters = 1; /// The BPF initialized function takes a list of BPF filters.
  optional uint64 default_gate = 2; /// The gate of a packet no filter matches (default: 0).
}

/**
 * The Buffer module takes no parameters to initialize (ie, `Buffer()` is sufficient to create one).
 * Buffer accepts packets and stores them; it may forward them to the next module only after it has
 * received enough packets to fill an entire PacketBatch.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message BufferArg {
}

/**
 * The Bypass module forwards packets by emulating pre-defined packet processing overhead.
 * It burns cpu cycles per_batch, per_packet, and per-bytes.
 * Bypass is useful primarily for testing and performance evaluation.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message BypassArg {
  uint32 cycles_per_batch = 1;
  uint32 cycles_per_packet = 2;
  uint32 cycles_per_byte = 3;
}

/**
 * The Dump module blindly forwards packets without modifying them. It periodically samples a packet and prints out out to the BESS log (by default stored in `/tmp/bessd.INFO`).
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message DumpArg {
  double interval = 1; ///How frequently to sample and print a packet, in seconds.
}

/**
 * The EtherEncap module wraps packets in an Ethernet header, but it takes no parameters. Instead, Ethernet source, destination, and type are pulled from a packet's metadata attributes.
 * For example: `SetMetadata('dst_mac', 11:22:33:44:55) -> EtherEncap()`
 * This is useful when upstream modules wish to assign a MAC address to a packet, e.g., due to an ARP request.
 *
 * The header goes into the packet's headroom. A shared payload (a clone, an
 * indirect mbuf) is copied first (D-153), as its headroom is the other
 * holders' buffer too. A packet without the headroom, or whose copy fails,
 * is dropped, never forwarded without the header.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message EtherEncapArg {
}

/**
 * The ExactMatch module splits packets along output gates according to exact match values in arbitrary packet fields.
 * To instantiate an ExactMatch module, you must specify which fields in the packet to match over. You can add rules using the function `ExactMatch.add(...)`
 * Fields may be stored either in the packet data or its metadata attributes.
 * An example script using the ExactMatch code is found
 * in [`bessctl/conf/samples/exactmatch.yaml`](./bessctl/conf/samples/exactmatch.yaml).
 *
 * __Input Gates__: 1
 * __Output Gates__: many (configurable)
 */
message ExactMatchArg {
  repeated Field fields = 1; ///A list of ExactMatch Fields
  repeated FieldData masks = 2; /// mask(i) corresponds to the mask for field(i)
  optional uint64 default_gate = 4; /// The gate of a packet no rule matches (default: drop); set_default_gate changes it later.
  repeated ResultField result_fields = 5; /// What a match writes: each field's bytes come from the rule's result record. Empty: gate-only.
  optional bytes default_result = 6; /// Placed on a miss, in addition to taking default_gate. Absent: a miss writes no result fields.
}

/**
 * ExactMatch's run-time settings (D-129): the singleton resource
 * "<module>/settings". default_gate is the gate of a packet no rule matches
 * (DROP_GATE, 8192, drops it); setting it is what set_default_gate does. The
 * rules are the map resource "<module>/rules".
 */
message ExactMatchSettings {
  uint64 default_gate = 1;
}

/**
 * The FlowGen module generates simulated TCP flows of packets with correct SYN/FIN flags and sequence numbers.
 * This module is useful for testing, e.g., a NAT module or other flow-aware code.
 * Packets are generated off a base, "template" packet by modifying the IP src/dst and TCP src/dst. By default, only the ports are changed and will be modified by incrementing the template ports by up to 20000 more than the template values.
 *
 * __Input Gates__: 0
 * __Output Gates__: 1
 */
message FlowGenArg {
  bytes template = 1; /// The packet "template". All data packets are derived from this template and contain the same payload.
  double pps = 2; /// The total number of packets per second to generate.
  double flow_rate = 3; /// The number of new flows to create every second. flow_rate must be <= pps.
  double flow_duration = 4; /// The lifetime of a flow in seconds.
  string arrival = 5; /// The packet arrival distribution -- must be either "uniform" or "exponential"
  string duration = 6; /// The flow duration distribution -- must be either "uniform" or "pareto"
  bool quick_rampup = 7; /// Whether or not to populate the flowgenerator with initial flows (start generating full pps rate immediately) or to wait for new flows to be generated naturally (all flows have a SYN packet).
  uint32 ip_src_range = 8; /// When generating new flows, FlowGen modifies the template packet by changing the IP src, incrementing it by at most ip_src_range (e.g., if the base packet is 10.0.0.1 and range is 5, it will generate packets with IPs 10.0.0.1-10.0.0.6).
  uint32 ip_dst_range = 9; /// When generating new flows, FlowGen modifies the template packet by changing the IP dst, incrementing it by at most ip_dst_range.
  uint32 port_src_range = 10; /// When generating new flows, FlowGen modifies the template packet by changing the TCP port, incrementing it by at most port_src_range.
  uint32 port_dst_range = 11; /// When generating new flows, FlowGen modifies the template packet by changing the TCP dst port, incrementing it by at most port_dst_range.
}

/**
 * The GenericDecap module strips off the first few bytes of data from a packet.
 *
 * The bytes must be in the packet's first segment (D-121): a shorter packet,
 * or a chain whose first segment ends inside them, is dropped (D-172), never
 * forwarded with the header still on. No byte is written, so a shared payload
 * is stripped as it is.
 *
 * __Input Gates__: 1
 * __Ouptut Gates__: 1
 */
message GenericDecapArg {
  uint64 bytes = 1; /// The number of bytes to strip off.
}

/**
 * The GenericEncap module adds a header to packets passing through it.
 * Takes a list of fields. Each field is either:
 *
 *  1. {'size': X, 'value': Y}          (for constant values)
 *  2. {'size': X, 'attribute': Y}      (for metadata attributes)
 *
 * e.g.: `GenericEncap([{'size': 4, 'value': 0xdeadbeef},
 *                      {'size': 2, 'attribute': 'foo'},
 *                      {'size': 2, 'value': 0x1234}])`
 * will prepend a 8-byte header:
 *    `de ad be ef <xx> <xx> 12 34`
 * where the 2-byte `<xx> <xx>` comes from the value of metadata attribute `'foo'`
 * for each packet.
 * An example script using GenericEncap is in [`bessctl/conf/samples/generic_encap.yaml`](./bessctl/conf/samples/generic_encap.yaml).
 *
 * The header goes into the packet's headroom. A shared payload (a clone, an
 * indirect mbuf) is copied first (D-153), as its headroom is the other
 * holders' buffer too. A packet without the headroom, or whose copy fails,
 * is dropped, never forwarded without the header.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message GenericEncapArg {
  /**
   * An EncapField represents one field in the new packet header.
   */
  message EncapField {
    uint64 size = 1; /// The length of the field.
    oneof insertion {
      string attribute = 2; /// The metadata attribute name to pull the field value from
      FieldData value = 3; /// Or, the fixed value to insert into the packet.
    }
  }
  repeated EncapField fields = 1;
}

/**
 * The HashLB module partitions packets between output gates according to either
 * a hash over their MAC src/dst (`mode='l2'`), their IP src/dst (`mode='l3'`), the full
 * IP/TCP 5-tuple (`mode='l4'`), or the N-tuple defined by `fields`.
 *
 * The L3 and L4 modes read the checked parse (core/packet_parse.h, D-188):
 * VLAN-tagged and IPv6 packets are hashed, a fragment hashes on its addresses
 * in either mode (so one datagram's fragments share a gate), and a packet
 * that is not IP or is malformed is dropped. The hash is symmetric: a flow's
 * two directions share a gate.
 *
 * __Input Gates__: 1
 * __Output Gates__: many (configurable)
 */
message HashLBArg {
  repeated int64 gates = 1; /// A list of gate numbers over which to partition packets
  string mode = 2; /// The mode (`'l2'`, `'l3'`, or `'l4'`) for the hash function.
  repeated Field fields = 3; /// A list of fields that define a custom tuple.
}

/**
 * Encapsulates a packet with an IP header, where IP src, dst, and proto are filled in
 * by metadata values carried with the packet. Metadata attributes must include:
 * ip_src, ip_dst, ip_proto, ip_nexthop, and ether_type.
 *
 * The header has no options, identification 0, don't-fragment set and TTL
 * 64, and goes into the packet's headroom. A shared payload (a clone, an
 * indirect mbuf) is copied first (D-153), as its headroom is the other
 * holders' buffer too. A packet is dropped, never forwarded without the
 * header, when it has no headroom, when the copy fails, or when it is too
 * long for the total length (more than 65,515 bytes before the header).
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message IPEncapArg {
}

/**
 * The DPDK longest-prefix-match structure behind an IPv4 route table (D-132).
 * LPM (rte_lpm) is the default. FIB (rte_fib DIR24_8, with BESS's carried
 * DPDK patches) changes routes much faster at every table size and has the
 * same limits and errors; x86-64 only (elsewhere ENOTSUP).
 */
enum RouteBackend {
  ROUTE_BACKEND_LPM = 0;
  ROUTE_BACKEND_FIB = 1;
}

/**
 * An L2Forward module forwards packets to an output gate according to exact-match rules over
 * an Ethernet destination.
 * Note that this is _not_ a learning switch -- forwards according to fixed
 * routes specified by `add(..)`.
 *
 * __Input Gates__: 1
 * __Ouput Gates__: many (configurable, depending on rules)
 */
message L2ForwardArg {
  int64 size = 1; /// Configures the forwarding hash table -- total number of hash table entries.
  int64 bucket = 2; /// Configures the forwarding hash table -- total number of slots per hash value.
  optional uint64 default_gate = 3; /// The gate of a packet no entry matches (default: drop); set_default_gate changes it later.
}

/// An entry of the L2Forward resource "<module>/macs" (D-114): key.
message L2ForwardMacKey {
  string addr = 1; /// The MAC address, lower-case as read back, e.g. "02:00:00:00:00:01"
}

/// An entry of the L2Forward resource "<module>/macs": value.
message L2ForwardMacValue {
  uint64 gate = 1; /// The output gate
}

/// The L2Forward singleton resource "<module>/settings" (D-129): what
/// set_default_gate sets. Read back with the current gate, 8192 (DROP_GATE)
/// when packets no entry matches are dropped.
message L2ForwardSettings {
  uint64 default_gate = 1; /// The gate of a packet no entry matches (8192: drop)
}

/**
 * The MACSwap module takes no arguments. It swaps the src/destination MAC addresses
 * within a packet.
 *
 * A frame whose first segment does not hold the 14-byte Ethernet header is
 * dropped. A frame whose payload is shared (a clone) is copied first, so the
 * payload's other holders never see the swap (D-153), and a frame whose copy
 * fails is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message MACSwapArg {
}

/**
 * The measure module tracks latencies, packets per second, and other statistics.
 * It should be paired with a Timestamp module, which attaches a timestamp to packets.
 * The measure module will log how long (in nanoseconds) it has been for each packet it received since it was timestamped.
 * This module is somewhat experimental and undergoing various changes.
 * There is a test for the Measure module (with Timestamp) in [`tests/live/module_traffic_test.cc`](./tests/live/module_traffic_test.cc).
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message MeasureArg {
  // int64 warmup = 1; /// removed: instead of warmup delay, user should Clear()
  oneof type {
    uint64 offset = 2; /// Where to store the current time within the packet, offset in bytes.
    string attr_name = 6; /// Where to store the current time as attribute
  }
  double jitter_sample_prob = 3; /// How often the module should sample packets for inter-packet arrival measurements (to measure jitter).
  uint64 latency_ns_max = 4; /// maximum latency expected, in ns (default 0.1 s)
  uint32 latency_ns_resolution = 5; /// resolution, in ns (default 100)
}

/**
 * The merge module takes no parameters. It has multiple input gates,
 * and passes out all packets from a single output gate.
 *
 * __Input Gates__: many (configurable)
 * __Output Gates__: 1
 */
message MergeArg {
}

/**
 * The MetadataTest module is used for internal testing purposes.
 */
message MetadataTestArg {
  map<string, int64> read = 1;
  map<string, int64> write = 2;
  map<string, int64> update = 3;
}

/**
 * The NAT module implements Dynamic IPv4 address/port translation,
 * rewriting packet source addresses with external addresses as specified,
 * and destination addresses for packets on the reverse direction.
 * L3/L4 checksums are updated correspondingly.
 * To see an example of NAT in use, see:
 * [`bessctl/conf/samples/nat.yaml`](./bessctl/conf/samples/nat.yaml)
 *
 * Currently only supports TCP/UDP/ICMP.
 * Note that address/port in packet payload (e.g., FTP) are NOT translated.
 *
 * A packet is translated in place: a shared payload (a clone, an indirect
 * mbuf) is copied first (D-153), and a packet whose copy fails is dropped, as
 * an untranslated one is.
 *
 * __Input Gates__: 2 (0 for internal->external, and 1 for external->internal direction)
 * __Output Gates__: 2 (same as the input gate)
 */
/**
 * A packet's connection-tracking result, as ConnTrack writes it to its
 * status_attr (D-182).
 */
enum ConnTrackStatus {
  CONNTRACK_STATUS_UNSPECIFIED = 0;
  CONNTRACK_STATUS_NEW = 1;        /// this packet created the connection
  CONNTRACK_STATUS_EXISTING = 2;   /// a packet of a tracked connection
  CONNTRACK_STATUS_RELATED = 3;    /// an ICMP error about a tracked connection
  CONNTRACK_STATUS_INVALID = 4;    /// may not start a connection, or refused by the TCP state machine
  CONNTRACK_STATUS_UNTRACKED = 5;  /// not trackable, or not tracked (PER_WORKER failing closed)
  CONNTRACK_STATUS_FULL = 6;       /// would start a connection, but the table is full
}

/**
 * Connection tracking (TP8, D-080): the conntrack library as a module.
 * igate 0 may start connections (the inside), igate 1 may not (the outside);
 * ogate 0 gets packets of tracked connections (new, existing, related),
 * ogate 1 everything else (invalid, untracked, refused for a full table).
 * With status_attr, each packet also carries its ConnTrackStatus, so a module
 * downstream can tell a new connection from an existing one (D-182).
 */
message ConnTrackArg {
  enum Mode {
    OWNED = 0;       /// one worker, one table
    PER_WORKER = 1;  /// one table per worker; needs symmetric RSS inputs
    SHARED = 2;      /// one table for every worker, any traffic distribution
  }
  Mode mode = 1;
  /// Connections per table (0: 65,536).
  uint64 capacity = 2;
  /// Accept an established TCP connection seen mid-stream (no SYN).
  bool tcp_pickup = 3;
  /// PER_WORKER on inputs that are not verified symmetric: track with one
  /// shared table instead of failing closed.
  bool fallback_shared = 4;
  /// The metadata attribute (1 byte, a ConnTrackStatus) each packet's result
  /// is written to; empty: none. The reader must be configured with the same
  /// name; with no reader the packets carry no status (PreResume reports it).
  string status_attr = 5;
}

message NATArg {
  message PortRange {
    uint32 begin = 1;
    uint32 end = 2;
    bool suspended = 3;
  }
  message ExternalAddress {
    string ext_addr = 1;
    repeated PortRange port_ranges = 2;
  }
  repeated ExternalAddress ext_addrs = 1; /// list of external IP addresses
  /// Initial binding capacity (0: 65,536, or what the addresses can serve if less).
  uint64 capacity = 2;
  /// Larger than capacity: the table grows, without stopping, up to this many
  /// bindings (at most what the addresses can serve). 0: fixed (one worker) or
  /// what the addresses serve (shared).
  uint64 max_capacity = 3;
  /// One NAT for every worker (any traffic distribution): lookups lock-free,
  /// creating a mapping takes a lock. Default: one worker.
  bool shared = 4;
  /// Count packets and IP bytes per mapping (both directions), and log a
  /// record when a mapping ends or a report is requested (drain_usage).
  bool usage = 5;
  /// Records the usage log holds until drained (0: 4096). A full log delays
  /// expiry, never drops a record.
  uint32 usage_log = 6;
}

/// A mapping's usage (NAT.drain_usage): totals since it was made; `final`
/// when it ended, otherwise an interim record from a requested report.
message NATUsageRecord {
  string internal_addr = 1;
  uint32 internal_port = 2;
  string external_addr = 3;
  uint32 external_port = 4;
  uint32 protocol = 5;
  uint64 packets = 6;
  uint64 bytes = 7;
  bool final = 8;
}

message NATUsageResponse {
  repeated NATUsageRecord records = 1;
  uint64 reports_done = 2;  /// requested reports completed so far
}

/**
 * Static NAT module implements one-to-one translation of source/destination
 * IPv4 addresses. No port number is translated.
 * L3/L4 checksums are updated correspondingly.
 * To see an example of NAT in use, see:
 * [`bessctl/conf/samples/nat.yaml`](./bessctl/conf/samples/nat.yaml)
 *
 * Forward direction (from input gate 0 to output gate 1):
 *  - Source IP address is updated, from internal to external address.
 * Reverse direction (from input gate 1 to output gate 0):
 *  - Destination IP address is updated, from external to internal address.
 * If the original address is outside any of the ranges, packets are forwarded
 * without NAT.
 *
 * Note that address in packet payload (e.g., FTP) are NOT translated.
 *
 * The headers are found with the checked parse: IPv4 untagged or behind up
 * to two VLAN tags, with options. A non-first fragment has its address and IP
 * checksum translated only (it carries no L4 header). A frame that is not
 * IPv4 (ARP, IPv6) is forwarded without NAT, as an address outside every
 * range is. A frame whose IP headers do not fit its first segment or are
 * inconsistent (lengths, TCP data offset, UDP length) is dropped. A frame
 * translated in place whose payload is shared (a clone) is copied first, so
 * the payload's other holders never see the translation (D-153), and a frame
 * whose copy fails is dropped.
 *
 * __Input Gates__: 2 (0 for internal->external, and 1 for external->internal direction)
 * __Output Gates__: 2 (1 for internal->external, and 0 for external->internal direction)
 */
message StaticNATArg {
  message AddressRange {
    string start = 1; /// first IP address to use
    string end = 2; /// last IP address to use
  }

  message AddressRangePair {
    AddressRange int_range = 1;
    AddressRange ext_range = 2; /// should be the same size as int_range
  }

  repeated AddressRangePair pairs = 1;
}

/**
 * The PortInc module connects a physical or virtual port and releases
 * packets from it. PortInc does not support multiqueueing.
 * For details on how to configure PortInc using DPDK, virtual ports,
 * or libpcap, see the sidebar in the wiki.
 *
 * __Input Gates__: 0
 * __Output Gates__: 1
 */
message PortIncArg {
  string port = 1; /// The portname to connect to.
  bool prefetch = 2; /// Whether or not to prefetch packets from the port.
  /// When set, each received packet's rte_flow MARK is written to this
  /// 4-byte (big-endian) metadata attribute (D-185): the MARK the PMD
  /// reports (RTE_MBUF_F_RX_FDIR_ID, hash.fdir.hi), else 0, so a rule's MARK
  /// must not be 0 (FlowRuleOwner's mark_base >= 1). Written only when a
  /// module downstream reads it. `PMDPortArg.rx_mark` negotiates delivery
  /// where the PMD supports negotiation (sfc requires it); mapping a MARK to a
  /// result is the application's.
  string mark_attr = 3;
}


enum ChecksumIpVersion {
  CHECKSUM_IP_VERSION_UNSPECIFIED = 0;
  CHECKSUM_IP_VERSION_IPV4 = 1;
  CHECKSUM_IP_VERSION_IPV6 = 2;
}

enum TxChecksumNetwork {
  TX_CHECKSUM_NETWORK_NONE = 0;
  TX_CHECKSUM_NETWORK_IPV4_HEADER = 1;
}

enum TxChecksumTransport {
  TX_CHECKSUM_TRANSPORT_NONE = 0;
  TX_CHECKSUM_TRANSPORT_UDP = 1;
  TX_CHECKSUM_TRANSPORT_TCP = 2;
}

enum TxEncapsulationKind {
  TX_ENCAPSULATION_NONE = 0;
  TX_ENCAPSULATION_IP = 1;
  TX_ENCAPSULATION_UDP = 2;
  TX_ENCAPSULATION_GTP = 3;
}

message TxChecksumDomain {
  uint64 network_offset = 1;
  uint64 transport_offset = 2;
  ChecksumIpVersion ip_version = 3;
  TxChecksumNetwork network = 4;
  TxChecksumTransport transport = 5;
}

message TxChecksumEncapsulation {
  TxEncapsulationKind kind = 1;
  ChecksumIpVersion outer_ip_version = 2;
  uint64 outer_network_offset = 3;
}

// Fixed two-domain checksum intent. Leave encapsulation unset for ordinary IP.
message TxChecksumProfile {
  TxChecksumEncapsulation encapsulation = 1;
  TxChecksumDomain outer = 2;
  TxChecksumDomain inner = 3;
}

/**
 * The PortOut module connects to a physical or virtual port and pushes
 * packets to it. For details on how to configure PortOut with DPDK,
 * virtual ports, libpcap, etc, see the sidebar in the wiki.
 *
 * __Input Gates__: 1
 * __Output Gates__: 0
 */
message PortOutArg {
  string port = 1; /// The portname to connect to.
  TxChecksumProfile tx_checksum_profile = 2; /// Optional fixed egress checksum profile.
}

/**
 * The module QueueInc produces input packets from a physical or virtual port.
 * Unlike PortInc, it supports multiqueue ports.
 * For details on how to configure QueueInc with DPDK, virtualports,
 * libpcap, etc, see the sidebar in the wiki.
 *
 * __Input Gates__: 0
 * __Output Gates__: 1
 */
message QueueIncArg {
  string port = 1; /// The portname to connect to (read from).
  uint64 qid = 2; /// The queue on that port to read from. qid starts from 0.
  bool prefetch = 3; /// When prefetch is enabled, the module will perform CPU prefetch on the first 64B of each packet onto CPU L1 cache. Default value is false.
  string mark_attr = 4; /// As PortIncArg.mark_attr (D-185): the rte_flow MARK, else 0, as a 4-byte big-endian attribute.
}

/**
 * The QueueOut module releases packets to a physical or virtual port.
 * Unlike PortOut, it supports multiqueue ports.
 * For details on how to configure QueueOut with DPDK, virtualports,
 * libpcap, etc, see the sidebar in the wiki.
 *
 * __Input Gates__: 1
 * __Output Gates__: 0
 */
message QueueOutArg {
  string port = 1; /// The portname to connect to.
  uint64 qid = 2; /// The queue on that port to write out to.
  TxChecksumProfile tx_checksum_profile = 3; /// Optional fixed egress checksum profile.
}

/**
 * The Queue module implements a simple packet queue.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message QueueArg {
  uint64 size = 1; /// The maximum number of packets to store in the queue.
  bool prefetch = 2; /// When prefetch is enabled, the module will perform CPU prefetch on the first 64B of each packet onto CPU L1 cache. Default value is false.
  bool backpressure = 3; // When backpressure is enabled, the module will notify upstream if it is overloaded.
}

/**
 * Queue's "<module>/settings" singleton (D-129): the queue's run-time state,
 * replacing set_size, set_burst and set_runtime_config. Every field is literal
 * (size 0 is refused; burst 0 releases nothing). Applied with workers paused;
 * a resize keeps the queued packets that fit.
 */
message QueueSettings {
  uint64 size = 1; /// Capacity in packets: a power of 2 in [4, 16384].
  uint64 burst = 2; /// Maximum packets per batch released, [0, 32].
  bool prefetch = 3; /// Prefetch the first 64B of each released packet.
  bool backpressure = 4; /// Signal overload upstream above the high water mark.
}

/**
 * The RandomSplit module randomly split/drop packets
 *
 * __InputGates__: 1
 * __Output Gates__: many (configurable)
 */
message RandomSplitArg {
  double drop_rate = 1; /// Probability of dropping packet.
  repeated int64 gates = 2; /// A list of gate numbers to split the traffic.
}

/**
 * The RandomUpdate module rewrites a specified field (`offset` and `size`) in a packet
 * with a random value between a specified min and max values.
 *
 * Exactly `size` bytes are written, big-endian; the bytes around the field
 * are untouched. Fields are written into the packet's first segment: a packet
 * whose first segment is shorter than the largest `offset` + `size` is dropped
 * rather than partly written. A packet whose payload is shared (a clone) is
 * copied first, so the payload's other holders never see the write (D-153),
 * and a packet whose copy fails is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message RandomUpdateArg {
  /**
   * RandomUpdate's Field specifies where to rewrite, and what values to rewrite
   * in each packet processed.
   */
  message Field {
    int64 offset = 1; /// Offset in bytes of where to rewrite. 0 or more, and offset + size must fit the packet data room (bessd --packet_data_room, 2048 by default).
    uint64 size = 2; /// The number of bytes to write: 1, 2 or 4.
    uint64 min = 3; /// The minimum value to insert into the packet.
    uint64 max = 4; /// The maximum value to insert into the packet.
  }
  repeated Field fields = 1; /// A list of Random Update Fields.
}

/**
 * The Rewrite module replaces an entire packet body with a packet "template"
 * converting all packets that pass through to copies of the of one of
 * the templates.
 *
 * A template is at most 1536 bytes and at most the packet data room
 * (`--packet_data_room`); a larger one is refused (EINVAL). A packet whose
 * payload is shared (a clone, its parent, a shared external buffer) gets a
 * buffer of its own first, so the other holder never sees the template
 * (D-153); a chain's tail is freed. A packet whose buffer cannot hold its
 * template (one from a pool with a smaller data room), or that cannot get a
 * buffer of its own, is dropped. With no template, packets pass unchanged.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message RewriteArg {
  repeated bytes templates = 1; /// A list of bytestrings representing packet templates.
}

/**
 * The RoundRobin module splits packets from one input gate across multiple output
 * gates.
 *
 * __Input Gates__: 1
 * __Output Gates__: many (configurable)
 */
message RoundRobinArg {
  repeated int64 gates = 1; /// A list of gate numbers to split packets across.
  string mode = 2; /// Whether to split across gate with every `'packet'` or every `'batch'`.
}

/**
 * The Replicate module makes copies of a packet sending one copy out over each
 * of n output gates.
 *
 * __Input Gates__: 1
 * __Output Gates__: many (configurable)
 */
message ReplicateArg {
  repeated int64 gates = 1; /// A list of gate numbers to send packet copies to.
}

/**
 * The SetMetadata module adds metadata attributes to packets, which are not stored
 * or sent out with packet data. For examples of SetMetadata use, see
 * [`bessctl/conf/samples/attr_match.yaml`](./bessctl/conf/samples/attr_match.yaml)
 *
 * An attribute copied from the packet (`offset`) is read from the packet's first
 * segment: a packet whose first segment is shorter than the largest `offset` +
 * `size` is dropped, never read past its data or across segments.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message SetMetadataArg {
  /**
   * SetMetadata Attribute describes a metadata attribute and value to attach to every packet.
   * If copying data from a packet buffer, SetMetadata can also logically shift
   * then mask the value before storing it as metadata, i.e.,
   * metadata_value = (packet_value >> `rshift_bits`) & `mask`.
   */
  message Attribute {
    string name = 1; /// The metadata attribute name.
    uint64 size = 2; /// The size of values stored in this attribute in bytes.
    oneof value {
      uint64 value_int = 3; /// An integer value to store in the packet (host-order).
      bytes value_bin = 4; /// A binary value to store in the packet (host-order).
    }
    int32 offset = 5; /// An index in the packet data to store copy into the metadata attribute.
    bytes mask = 6; /// An array of bit masks to apply to each of the bytes copied starting from `offset`. If empty, the mask `[0xFF,....,0xFF]` will be used.
    int32 rshift_bits = 7; /// The number of bits to shift the value at `offset` by before masking. Must be a multiple of 8. Positive and negative values represent right and left shifts respectively.
  }
  repeated Attribute attrs = 1; /// A list of attributes to attach to the packet.
}

/**
 * The sink module drops all packets that are sent to it.
 *
 * __Input Gates__: 1
 * __Output Gates__: 0
 */
message SinkArg {
}

/**
 * The Source module generates packets with no payload contents.
 *
 * __Input Gates__: 0
 * __Output Gates__: 1
 */
message SourceArg {
  uint64 pkt_size = 1; /// The size (in bytes) of packet data to produce.
  optional uint64 burst = 2; /// Packets per batch, at most 32 (default: 32); set_burst changes it later.
}

/**
 * Source's run-time settings (D-129): the singleton resource
 * "<module>/settings", applied live. pkt_size is what set_pkt_size sets
 * (1 up to the pool's data room), burst what set_burst sets (at most 32).
 */
message SourceSettings {
  uint64 pkt_size = 1; /// The size (in bytes) of the packets to create.
  uint64 burst = 2; /// Packets per batch, at most 32.
}

/**
* The IPChecksum module recomputes the IPv4 header checksum of packets
* (untagged or behind up to two VLAN tags, with options, fragments
* included). If verify is set to true, it checks the checksum instead:
* right on gate 0, wrong on gate 1. Packets that are not IPv4 (IPv6
* included) are forwarded on gate 0 without modification. A frame whose
* headers do not fit its first segment or lie about their lengths is
* dropped. A shared payload is copied before the write.
* Output gates: (0) Default, (1) Verify failed.
*
* __Input Gates__: 1
* __Output Gates__: 2
*/
message IPChecksumArg {
 bool verify = 1; /// check checksum
}

/**
* The L4Checksum module recomputes the TCP and UDP checksums of IPv4
* packets (untagged or behind up to two VLAN tags, with options): TCP's
* over the datagram the IP header states, UDP's over the UDP length (RFC
* 768; IP payload past it is trailing data), across a chained packet's
* segments. If verify is set to true, it checks the checksum instead:
* right on gate 0, wrong on gate 1; a UDP checksum of 0 means "none" and
* passes, and a checksum stored as 0xffff for a computed 0x0000 (-0) is
* right. Every other packet (not IPv4, IPv6 included; another IP protocol;
* a fragment) is forwarded on gate 0 without modification, as is a chain
* that splits a UDP datagram shorter than its IP payload (not summed). A
* frame whose headers do not fit its first segment or lie about their
* lengths (a UDP length under 8 or past the IP payload included) is
* dropped. A shared payload is copied before the write.
* Output gates: (0) Default, (1) Verify failed.
*
* __Input Gates__: MAX_GATES
* __Output Gates__: 2
*/
message L4ChecksumArg {
 bool verify = 1; /// check checksum
}

/**
 * The Split module is a basic classifier which directs packets out a gate
 * based on data in the packet (e.g., if the read in value is 3, the packet
 * is directed out output gate 3).
 *
 * __Input Gates__: 1
 * __Output Gates__: many (up to 2^(size * 8))
 */
message SplitArg {
  uint64 size = 1; /// The size of the value to read in bytes
  oneof type {
    string attribute = 2; /// The name of the metadata field to read.
    int64 offset = 3; /// The offset (in bytes) of the data field to read.
  }
}

/**
 * The timestamp module records the current time in nanoseconds, to be used
 * for latency measurements alongside the Measure module: in a metadata
 * attribute (`attr_name`, "timestamp" by default, used when no `offset` is
 * given), or in the packet at `offset` as a 4-byte marker and the 8-byte time.
 *
 * The in-packet stamp goes into the packet's first segment, and `offset` + 12
 * must fit the packet data room (`--packet_data_room`); a larger offset is
 * refused (EINVAL). A one-segment packet whose data reaches `offset` but ends
 * before the stamp's end is grown to hold it. A packet the stamp cannot be
 * placed in -- a chain whose first segment ends before the stamp's end, a
 * packet whose data ends before `offset`, or one without the tailroom to grow
 * -- is dropped, never forwarded without the stamp (D-172). A packet whose
 * payload is shared (a clone) is copied first, so the other holders never see
 * the stamp (D-153); one whose copy fails is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message TimestampArg {
  oneof type {
    uint64 offset = 1;
    string attr_name = 2;
  }
}

/**
 * The Update module rewrites a field in a packet's data with a specific value.
 *
 * Fields are written into the packet's first segment. A packet whose first
 * segment is shorter than the largest `offset` + `size` is dropped rather than
 * partly written; a packet whose payload is shared (a clone) is copied first, so
 * the payload's other holders never see the write (D-153), and a packet whose
 * copy fails is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message UpdateArg {
  /**
   * Update Field describes where in a packet's data to rewrite, and with what value.
   */
  message Field {
    int64 offset = 1; /// The offset in the packet in bytes to rewrite at. 0 or more, and offset + size must fit the 2048-byte data room.
    uint64 size = 2; /// The number of bytes to rewrite, 1-8.
    uint64 value = 3; /// The value to write into the packet; it must fit in `size` bytes.
  }
  repeated Field fields = 1; /// A list of Update Fields.
}

/**
 * The URLFilter performs TCP reconstruction over a flow and blocks
 * connections which mention a banned URL.
 *
 * Only untagged IPv4 TCP on input gate 0 is analyzed; other frames pass
 * (gate 0). A frame the checked parse refuses (headers that do not fit the
 * first segment, lengths that lie) is dropped. A flow's request is
 * reconstructed from the first 64 KiB after the SYN; data past that is
 * ignored.
 *
 * __Input Gates__: 2
 * __Output Gates__: 2
 *
 * Note that the add() command takes this same argument, and the
 * clear() command takes an empty argument.
 */
message UrlFilterArg {
  /**
   * A URL consists of a host and a path.
   */
  message Url {
    string host = 1;  /// Host field, e.g. "www.google.com"
    string path = 2;  /// Path prefix, e.g. "/"
  }
  repeated Url blacklist = 1; /// A list of Urls to block.
}

/**
 * The runtime configuration of a URLFilter is the current
 * blacklist.  This means that getting the Arg gets an *empty*
 * list: we assume anyone using get_initial_arg is also using
 * get_runtime_config.
 */
message UrlFilterConfig {
  repeated UrlFilterArg.Url blacklist = 1;
}

/**
 * VLANPop removes the VLAN tag.
 *
 * A frame shorter than an Ethernet header is dropped, and so is a tagged frame
 * whose first segment ends before the tag and the EtherType after it (18 bytes):
 * it is never forwarded still tagged. An untagged frame passes unchanged. A
 * tagged frame whose payload is shared is copied before the tag is removed (D-153);
 * a failed copy is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message VLANPopArg {
}

/**
 * VLANPush appends a VLAN tag with a specified TCI value.
 *
 * A frame whose first segment is shorter than an Ethernet header, or that has no
 * headroom for the tag, is dropped rather than forwarded untagged. A frame whose
 * payload is shared is copied before the tag is written (D-153); a failed copy is
 * dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message VLANPushArg {
  uint64 tci = 1; /// The TCI value to insert in the VLAN tag.
}

/**
 * Splits packets across output gates according to VLAN id (e.g., id 3 goes out gate 3).
 *
 * Untagged frames leave on gate 0. As in VLANPop, a frame shorter than an Ethernet
 * header, or a tagged one whose first segment is shorter than 18 bytes, is dropped,
 * and a shared payload is copied before the tag is removed (D-153); a failed copy
 * is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: many
 */
message VLANSplitArg {
}

/**
 * VXLANDecap module decapsulates a VXLAN header on a packet.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message VXLANDecapArg {
}

/**
 * VXLANEncap module wraps a packet in a VXLAN header with a specified destination port.
 *
 * The UDP and VXLAN headers go into the packet's headroom. A shared payload
 * (a clone, an indirect mbuf) is copied first (D-153), as its headroom is
 * the other holders' buffer too. A packet is dropped, never forwarded
 * without the headers, when it has no headroom, when the copy fails, or when
 * it is too long for the UDP length (more than 65,519 bytes before the
 * headers).
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message VXLANEncapArg {
  uint64 dstport = 1; /// The destination UDP port
}

/**
 * The WildcardMatch module matches over multiple fields in a packet and
 * pushes packets that do match out a specified gate, and those that don't out a default
 * gate. WildcardMatch is initialized with the fields it should inspect over,
 * rules are added via the `add(...)` function.
 * An example of WildcardMatch is in [`bessctl/conf/samples/wildcardmatch.yaml`](./bessctl/conf/samples/wildcardmatch.yaml)
 *
 * __Input Gates__: 1
 * __Output Gates__: many (configurable)
 */
message WildcardMatchArg {
  repeated Field fields = 1; /// A list of WildcardMatch fields.
  /// Distinct masks in use at once (1-1024; 0 or unset: 8, master's limit).
  /// Each mask in use is one hash lookup per batch; the limit itself costs
  /// nothing on the packet path. A new mask beyond it is refused with ENOSPC.
  uint32 max_tuples = 2;
  optional uint64 default_gate = 3; /// The gate of a packet no rule matches (default: drop); set_default_gate changes it later.
  repeated ResultField result_fields = 5; /// What a match writes: each field's bytes come from the rule's result record. Empty: gate-only.
  optional bytes default_result = 6; /// Placed on a miss, in addition to taking default_gate. Absent: a miss writes no result fields.
}

/**
 * The ARP Responder module is responding to ARP requests.
 * It has a function `add(...)` which adds one IP-MAC mapping.
 *
 * A request for an entry's address is rewritten in place into the reply, as
 * Vif's local responder answers. The reply's Ethernet destination is the
 * request's ARP sender hardware address, not its Ethernet source: RFC 826
 * sends the reply "to the (new) target hardware address", and Linux's
 * arp_process does the same (arp_send_dst with dest_hw = sha). Only
 * IPv4-over-Ethernet ARP is answered (hardware type
 * 1, protocol 0x0800, lengths 6 and 4, the 42-byte message in the frame's
 * first segment); every other frame is dropped, as are replies, other opcodes
 * and requests for other addresses. A request whose payload is shared (a
 * clone) is copied first, so the payload's other holders never see the reply
 * (D-153), and a request whose copy fails is dropped.
 *
 * TODO: Dynamic learn new MAC's-IP's mapping
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message ArpResponderArg {
  string ip = 1; /// The IP
  string mac_addr = 2; /// The MAC address
}

/// The key of an ArpResponder's "<module>/entries" resource (D-129): the IPv4
/// address answered for, read back in dotted decimal.
message ArpResponderEntryKey {
  string ip = 1;
}

/// The value of an ArpResponder's "<module>/entries" resource: the MAC the
/// address resolves to, read back in lower case.
message ArpResponderEntryValue {
  string mac_addr = 1;
}

/**
 * The MPLS pop module removes MPLS labels
 *
 * A frame whose EtherType is MPLS unicast (0x8847) loses its outermost label
 * and leaves on output gate 0 with `next_eth_type` (or without its Ethernet
 * header, with `remove_eth_header`); any other frame leaves on output gate 1
 * unchanged. A labelled frame whose first segment does not hold the Ethernet
 * header and the label (18 bytes) is dropped, never forwarded still labelled,
 * as is a frame shorter than an Ethernet header. Keeping the Ethernet header
 * rewrites it in place: a frame whose payload is shared (a clone) is copied
 * first (D-153), and a frame whose copy fails is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 2
 */
message MplsPopArg {
  bool remove_eth_header = 1; /// Remove ETH header with the pop
  uint32 next_eth_type = 2; /// The next ETH type to set
}

/**
 * WorkerSplit splits packets based on the worker calling ProcessBatch(). It has
 * two modes.
 * 1) Packets from worker `x` are mapped to output gate `x`. This is the default
 *    mode.
 * 2) When the `worker_gates` field is set, packets from a worker `x` are mapped
 *    to `worker_gates[x]`.  In this mode, packet batches from workers not
 *    mapped to an output gate will be dropped.
 *
 * Calling the `reset` command with an empty `worker_gates` field will revert
 * WorkerSplit to the default mode.
 *
 * __Input Gates__: 1
 * __Output Gates__: many
 */
message WorkerSplitArg {
  map<uint32, uint32> worker_gates = 1; // ogate -> worker mask
}

// Which bytes a meter charges. The historical unit, and the default, is the
// whole L2 frame. L3 counts the IP datagram (IPv4 or IPv6, parsed from the
// version nibble at `byte_offset` if the packet carries no parsed protocol);
// L4 counts the transport segment inside it, which is the same figure for UDP
// and TCP (their headers are part of the segment). CUSTOM counts every frame
// byte at or after `byte_offset` (a tunnel payload, for example). A packet the
// chosen basis cannot measure -- a short frame, a malformed header, an
// unknown version -- is dropped, never forwarded unmetered.
enum MeterByteBasis {
  METER_BYTE_BASIS_L2 = 0;      // the whole frame (total_len)
  METER_BYTE_BASIS_L3 = 1;      // the IP datagram (IPv4 total, or IPv6 40 + payload)
  METER_BYTE_BASIS_L4 = 2;      // the transport segment (the IP payload)
  METER_BYTE_BASIS_CUSTOM = 3;  // frame bytes from byte_offset on
}

/**
 * The Meter module polices packets against per-session meters (K5), with the
 * meter set changed transactionally (G1.2b): the meter ids come from packet
 * metadata, one per level, and each is checked colour-aware, in order. Green
 * and yellow packets are charged to the later levels; a red one stops and is
 * not charged to them. The packet leaves on the gate that is its worst
 * colour -- 0 green, 1 yellow, 2 red. An id that names no meter is dropped;
 * id 0 means "no meter at this level" and passes it.
 *
 * __Input Gates__: 1
 * __Output Gates__: 3 (green, yellow, red)
 */
message MeterArg {
  uint64 capacity = 1; /// Most meters this module's table holds (default 1024).
  string id_attr = 2; /// The metadata attribute the meter id is read from (default "meter_id"). A graph with two meters -- a flow maximum and a session aggregate -- sets it so each reads its own identity.
  // How many meter ids one packet carries, in policing order: the attribute
  // named by `id_attr` is declared 4 * levels bytes wide, and the module checks
  // each non-zero slot in turn (green and yellow continue, red stops). Default
  // 1, the historical one-meter packet.
  uint32 levels = 3;
  MeterByteBasis byte_basis = 4; /// Which bytes are charged (default L2: the whole frame).
  // The first byte the basis counts from. For IP, the offset of the IP header
  // in the frame (0 for a bare IP packet, 14 for an untagged Ethernet frame,
  // 18 with one VLAN tag); for FROM, the first counted byte. Must be 0 for L2.
  uint32 byte_offset = 5;
  // What one packet is charged. Bytes is the historical unit (and what a
  // bit-rate QER's MBR/GBR mean); Packets makes the same buckets count
  // packets, so a profile of `peak_rate: 1000` is 1000 packets a second -- the
  // unit of the QER's Packet Rate (8.2.63) and the serving-PLMN rate control.
  // With PACKETS the basis and its offset are unused.
  enum MeterCost {
    METER_COST_BYTES = 0;
    METER_COST_PACKETS = 1;
  }
  MeterCost cost = 6;
}

/**
 * The Meter module's `get_status` action returns the profile and the mutable
 * token state of configured meters, as they stand now. An empty
 * `meter_ids` lists every meter the module holds; an id that names no live
 * meter is refused (ENOENT). A meter being retired -- erased, but still in the
 * published generation until the removal cascade -- is no longer live.
 *
 * The reading is per meter state, not an aggregate. A meter's `shared` flag
 * says whether that state is checked under the meter's own spinlock (the
 * module creates shared meters, so every entry here is normally shared) or
 * owned by one worker (a kWorkerExclusive meter, whose state is coherent only
 * while that worker is not running it).
 */
message MeterCommandGetStatusArg {
  repeated uint32 meter_ids = 1; /// Empty: every configured meter.
}

enum MeterBucketKind {
  METER_BUCKET_COMMITTED = 0; /// The C bucket (all meter algorithms).
  METER_BUCKET_EXCESS = 1;    /// The E bucket (srTCM, RFC 4115).
  METER_BUCKET_PEAK = 2;      /// The P bucket (trTCM, RFC 2698).
}

message MeterBucketState {
  MeterBucketKind kind = 1;
  uint64 tokens = 2; /// Tokens available at `last_update_tsc`, in the meter's unit.
  uint64 limit = 3;  /// Bucket capacity (CBS, EBS or PBS), in the same unit.
}

message MeterStatus {
  uint32 meter_id = 1;
  MeterPolicyValue policy = 2; /// The profile the meter is running.
  bool shared = 3; /// Whether checks of this meter take its own spinlock.
  // The TSC of the meter's last check -- or of its bucket initialization, for
  // a meter that has never been checked. rte_meter refills only on a check,
  // so the bucket reading is as of this time, not projected to now.
  uint64 last_update_tsc = 4;
  // Committed first, then the excess (srTCM, RFC 4115) or peak (trTCM) bucket.
  repeated MeterBucketState buckets = 5;
}

message MeterCommandGetStatusResponse {
  repeated MeterStatus meters = 1;
}

/**
 * What a Router decides each packet's next hop from (D-155).
 */
enum RouteMode {
  ROUTE_MODE_NEXT_HOP_ID = 0; /// The `next_hop_id` metadata a classifier writes: the module executes a decision made upstream. With no writer it drops every packet and reports it once per resume (D-129), never guessing.
  ROUTE_MODE_DESTINATION = 1; /// The packet's IPv4 or IPv6 destination address, looked up in the route domain it carries.
}

enum FlowHashFields {
  FLOW_HASH_L3_L4 = 0; /// The address pair, the ports and the protocol: one member per flow (the default, D-163).
  FLOW_HASH_L3 = 1; /// The address pair only: every flow to one destination takes the same member (D-163).
}

/**
 * The Router module forwards a packet to the egress its next-hop id (from
 * packet metadata) names, or -- in ROUTE_MODE_DESTINATION -- routes it by its
 * destination address in the route domain it carries (D-155). Routes, next
 * hops, neighbor bindings and next-hop groups are the resources D-023
 * describes, changed together or not at all.
 *
 * Address families (D-183). In ROUTE_MODE_NEXT_HOP_ID the router has no FIB:
 * it forwards IPv4 and IPv6 alike, decrementing each packet's TTL or hop
 * limit by its own family, takes interface addresses and neighbor bindings of
 * either family, and refuses every field only a FIB would read
 * (max_ipv4_routes, max_ipv4_tbl8s, max_ipv6_routes, max_ipv6_tbl8s, a
 * non-default backend, a nonzero max_groups, max_domains above 1, a
 * non-default flow_hash, domain_attr, punt_miss_gate, punt_unresolved_gate)
 * and every route and group write. An empty RouterArg is a valid next-hop-id
 * router. In ROUTE_MODE_DESTINATION a
 * family is enabled exactly when its route capacity is set: IPv4 with
 * max_ipv4_routes, IPv6 with max_ipv6_routes, at least one of them. A
 * disabled family has no FIB in any domain; its frames are dropped and
 * counted (family_disabled), and its routes, interface addresses and neighbor
 * bindings are refused. In both modes the neighbor protocols read (ARP,
 * Neighbor Discovery) are those of the interfaces' configured addresses.
 *
 * Neighbor resolution (D-183). With `interfaces`, the router resolves the
 * next hops bound in its "<module>/neighbors" resource (RouterNeighborBinding)
 * and publishes their state; its get_neighbors action
 * (RouterCommandGetNeighborsResponse) reports each binding's state, MAC,
 * reconfirmation and probe count.
 *
 * __Input Gates__: 1
 * __Output Gates__: many (the next hop's egress)
 */
message RouterArg {
  uint64 max_next_hops = 3; /// Most next hops (default 4096). Destination mode: together with max_groups, bounded by the 24-bit route value; next-hop-id mode: by the 32-bit id.
  uint64 max_domains = 4; /// Destination mode: route domains (VRFs) 0..n-1, each with its own FIB per enabled family, sized as above (default 1: the default domain only). Above 1 is refused in next-hop-id mode.
  RouteBackend backend = 5; /// Destination mode: the IPv4 route table structure (default: LPM). IPv6 always uses rte_fib6. A non-default value is refused in next-hop-id mode.
  RouteMode mode = 6; /// What the packet path decides from (default: the next_hop_id metadata).
  uint64 max_groups = 7; /// Destination mode: most next-hop groups (default 0: none; a route may name a group only with a nonzero bound). Together with max_next_hops, bounded by the 24-bit route value. A nonzero value is refused in next-hop-id mode, where only a route could name a group.
  uint64 punt_miss_gate = 8; /// Destination mode: where a frame the FIB has no route for goes instead of being dropped: an output gate, or 0 (the default) or DROP_GATE (8192) to drop it. Gate 0 is a real gate, so a punt target is any other gate. The frame is counted either way (D-162). Any nonzero value is refused in next-hop-id mode.
  uint64 punt_unresolved_gate = 9; /// Destination mode: where a frame whose hop's neighbor is unresolved goes instead of being dropped: an output gate, or 0 (the default) or DROP_GATE to drop it. The frame is counted either way (D-162). Any nonzero value is refused in next-hop-id mode.
  FlowHashFields flow_hash = 10; /// Destination mode: which fields a route that names a next-hop group hashes to pick its member (default: the whole flow, D-163). A non-default value is refused in next-hop-id mode.
  string next_hop_attr = 11; /// The metadata attribute next-hop mode reads the next-hop id from (default "next_hop_id").
  string domain_attr = 12; /// Destination mode: the metadata attribute the route domain is read from (default "route_domain"). Refused in next-hop-id mode.
  uint64 punt_local_gate = 13; /// Where a frame to this node's own address (a local route) goes instead of being dropped: an output gate, or 0 (the default) or DROP_GATE (8192) to drop it. So do link-local or multicast IPv6 frames in destination mode, which are never forwarded, and, unless punt_neighbor_gate names another gate, the ARP requests and Neighbor Solicitations a resolving router receives. The frame is counted either way (D-178, D-183).
  optional uint64 max_ipv4_routes = 14; /// Destination mode: IPv4 routes per domain; setting it enables IPv4 (0 is refused). Refused in next-hop-id mode.
  optional uint64 max_ipv4_tbl8s = 15; /// Destination mode: IPv4 tbl8 groups per domain, one per /24 holding a longer route (absent: 256; 0 is refused; needs max_ipv4_routes). Refused in next-hop-id mode.
  optional uint64 max_ipv6_routes = 16; /// Destination mode: IPv6 routes per domain; setting it enables IPv6 (0 is refused). Refused in next-hop-id mode.
  optional uint64 max_ipv6_tbl8s = 17; /// Destination mode: IPv6 (rte_fib6) tbl8 groups per domain (absent: 8192; 0 is refused; needs max_ipv6_routes). A route reserves one per byte between its length and its covering route's, counted from /24. Refused in next-hop-id mode.
  uint64 punt_neighbor_gate = 18; /// Where the ARP requests and Neighbor Solicitations a resolving router receives go, in either mode: an output gate (the responder that answers for the interfaces' addresses), DROP_GATE (8192) to drop them, or 0 (the default) to follow punt_local_gate. Counted either way (D-183).
  string ingress_interface_attr = 19; /// The metadata attribute naming the RouterInterface a frame arrived on, read for ARP and Neighbor Discovery input (default "vif_id", what Vif writes).
  repeated RouterInterface interfaces = 20; /// The router's own interfaces that neighbor resolution solicits from; setting any enables neighbor resolution and the "<module>/neighbors" resource. Fixed at Init.
  uint64 max_neighbors = 21; /// Most bound next hops in "<module>/neighbors", and so most neighbors resolved (default 1024 or max_next_hops, whichever is smaller; above max_next_hops is refused).
  optional uint64 neighbor_first_probe_ms = 22; /// Delay from a binding to its neighbor's first solicitation, counted from the maintenance tick that takes the binding up (absent: 1000; 0: on that tick).
  optional uint64 neighbor_probe_interval_ms = 23; /// First retry delay of an attempt; later retries double it (absent: 1000; 0 is refused).
  optional uint64 neighbor_max_probe_interval_ms = 24; /// Retry backoff ceiling (absent: 8000; 0 or below the probe interval is refused).
  optional uint64 neighbor_max_probes = 25; /// Solicitations per resolution attempt (absent: 3; 0 is refused).
  optional uint64 neighbor_reachable_lifetime_ms = 26; /// How long a resolved neighbor goes unconfirmed before it is solicited again; it keeps forwarding while that attempt runs and fails only when the attempt does (absent: 30000; 0: never re-solicit, D-183).
  optional uint64 neighbor_unreachable_retry_ms = 27; /// How long an unreachable neighbor waits before another attempt (absent: 8000, the backoff ceiling's default; 0: no further attempt).
}

/**
 * The Vif module manages Virtual Interfaces (VIFs) sharing a physical port or
 * pipeline. It classifies packets by VLAN (802.1Q) and destination MAC,
 * strips the VLAN tag on ingress, assigns logical vif_id and route_domain
 * metadata, responds to local ARP requests for the VIF's IP address, and
 * steers traffic to designated output gates.
 *
 * A frame shorter than an Ethernet header, or a tagged one whose first segment
 * ends before the tag and the EtherType after it (18 bytes), leaves on the default
 * gate unchanged. A frame whose payload is shared (a clone) is copied before the
 * tag strip or an ARP/ND answer rewrites it (D-153); a failed copy is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: many
 */
message VifArg {
  message Interface {
    uint32 id = 1;             /// Logical VIF ID
    uint32 vlan = 2;           /// 802.1Q VLAN tag (0: untagged)
    string mac_addr = 3;       /// Interface MAC address
    string ip_addr = 4;        /// Local IPv4 address for ARP responder (optional)
    uint32 route_domain = 5;   /// Associated L3 VRF Route Domain ID
    uint32 gate = 6;           /// Egress/demux output gate
    string ipv6_addr = 7;      /// Local IPv6 address for ND responder (optional)
  }
  repeated Interface interfaces = 1;
  uint32 default_gate = 2;     /// Gate for unclassified traffic (default: DROP_GATE)
  string vif_id_attr = 3;      /// The metadata attribute the VIF id is written to (default "vif_id")
  string route_domain_attr = 4; /// The metadata attribute the route domain is written to (default "route_domain")
}

message VifCommandAddArg {
  uint32 id = 1;
  uint32 vlan = 2;
  string mac_addr = 3;
  string ip_addr = 4;
  uint32 route_domain = 5;
  uint32 gate = 6;
  string ipv6_addr = 7;
}

/// The key of a Vif's "<module>/interfaces" resource (D-129): the logical VIF
/// ID (non-zero).
message VifInterfaceKey {
  uint32 id = 1;
}

/// The value of a Vif's "<module>/interfaces" resource: the interface's
/// fields (VifArg.Interface without the id, which is the key). Read back
/// canonically: the MAC in lower case and omitted when all zero, the IPv4
/// address in dotted decimal and omitted when 0.0.0.0.
message VifInterfaceValue {
  uint32 vlan = 1;           /// 802.1Q VLAN tag 0..4095 (0: untagged)
  string mac_addr = 2;       /// Interface MAC address
  string ip_addr = 3;        /// Local IPv4 address for ARP responder (optional)
  uint32 route_domain = 4;   /// Associated L3 VRF Route Domain ID
  uint32 gate = 5;           /// Egress/demux output gate
  string ipv6_addr = 6;      /// Local IPv6 address for ND responder (optional)
}

/**
 * The Bridge module is an L2 learning bridge. It dynamically learns MAC
 * addresses from incoming packets, maps them to arrival gates with an aging
 * timer, and forwards packets toward known destinations while flooding
 * unknown unicast and broadcast packets to all other active gates.
 *
 * __Input Gates__: many
 * __Output Gates__: many
 */
message BridgeArg {
  uint32 size = 1;        /// Maximum dynamic MAC entries (default: 1024)
  uint32 aging_time = 2;  /// Aging timeout in seconds (default: 300)
}

/// The key of a Bridge's "<module>/statics" resource (D-129): one static MAC.
/// Read back in lower case ("02:aa:bb:cc:dd:ee"); a multicast MAC is refused.
message BridgeStaticKey {
  string mac_addr = 1;
}

/// The value of a Bridge's "<module>/statics" resource: the output gate the
/// static MAC is forwarded to (DROP_GATE blackholes it). Learned entries are
/// runtime state and not part of the resource.
message BridgeStaticValue {
  uint32 gate = 1;
}

/**
 * The PacketStore module implements a bounded, ownership-safe packet buffer (K9).
 * Buffers incoming packets correlated by an ID (from metadata or packet key),
 * enqueuing up to `max_packets` total and `max_packets_per_flow` per flow.
 * Packets are released on demand via `release(id)` or evicted on timeout/overflow.
 *
 * The store is owned by the module's own task, so any worker may feed it and
 * the three commands below are accepted while the dataplane runs: with a worker
 * running they take effect on the owner's next task run, in the order they were
 * sent, and a client reads the result back (a gate, a count, or the module's
 * description). They never fail with ENOENT - a flow that holds nothing is a
 * no-op - and a full request ring is ENOSPC, which may be retried. The memory
 * bound is `max_packets` stored, plus the ingress ring's in-flight packets
 * (4095; when the ring is full they are freed, and
 * bess_packet_store_ingress_dropped_packets_total counts them), plus the
 * packets a release has queued for the owner to emit. Erasing a
 * "<module>/flows" entry leaves that flow's packets in the store: `drop` is the
 * action that frees them.
 *
 * __Input Gates__: 1
 * __Output Gates__: 2 (0: released, 1: expired/evicted)
 */
message PacketStoreArg {
  uint32 max_packets = 1;           /// Maximum total packets in store (default: 4096)
  uint32 max_packets_per_flow = 2;  /// Maximum packets per flow/session ID (default: 64)
  uint32 timeout_ms = 3;            /// Maximum buffering time in ms (default: 5000)
  repeated string key_attrs = 4;    /// The metadata attributes that may carry the flow ID,
                                    /// in priority order: the first one this graph provides
                                    /// is the key. Default: store_id, then vif_id.
}

/// The per-flow limits of the "<module>/flows" resource (D-129): a flow's own
/// numbers, set inside the session's transaction. An entry with neither field
/// set, or no entry at all, leaves PacketStoreArg's module-wide numbers in
/// force; a timeout_ns of 0 (present) means this flow's packets never expire,
/// and max_packets_per_flow of 0 (present) means the module-wide per-flow
/// default. The module-wide max_packets stays the outer bound for every flow.
message PacketStoreFlowKey {
  uint32 id = 1;                    /// Flow/session ID (the key_attrs value)
}

message PacketStoreFlowValue {
  optional uint64 timeout_ns = 1;           /// 0 = no expiry; absent = PacketStoreArg.timeout_ms
  optional uint32 max_packets_per_flow = 2; /// 0 = PacketStoreArg.max_packets_per_flow
}

message PacketStoreCommandReleaseArg {
  uint32 id = 1;                    /// Flow/session ID to release
  uint32 gate = 2;                  /// Target output gate (default: 0)
}

message PacketStoreCommandDropArg {
  uint32 id = 1;                    /// Flow/session ID to drop
}

message PacketStoreCommandClearArg {
}
