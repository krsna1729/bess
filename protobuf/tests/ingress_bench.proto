syntax = "proto3";

package bess.pb.test;

// G1.2 E4: how fast can dataplane modifications get into bessd? A
// benchmark-only service; not part of any public API.

message IngressOp {
  uint32 kind = 1;  // 0 insert, 1 delete
  fixed64 key = 2;
  fixed64 value = 3;
}

message IngressBatch {
  repeated IngressOp ops = 1;  // one message per op
  bytes packed = 2;            // or fixed 16-byte records: key (top bit =
                               // delete), value
  bool apply = 3;              // apply into the table, or decode only
}

message IngressAck {
  uint64 applied = 1;
}

service IngressBench {
  rpc Apply(IngressBatch) returns (IngressAck) {}
  rpc ApplyStream(stream IngressBatch) returns (IngressAck) {}
}
