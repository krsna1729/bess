syntax = "proto3";

package bess.pb;

message PCAPPortArg {
  string dev = 1;
}

message PMDPortArg {
  bool loopback = 1;
  oneof port {
    uint64 port_id = 2;
    string pci = 3;
    string vdev = 4;
  }

  // See http://dpdk.org/doc/dts/test_plans/dual_vlan_test_plan.html
  bool vlan_offload_rx_strip = 5;
  bool vlan_offload_rx_filter = 6;
  bool vlan_offload_rx_qinq = 7;

  /// Both directions of a connection reach the same receive queue (TP8): a
  /// symmetric Toeplitz hash where the device offers it, else the Toeplitz
  /// hash with a symmetric key. Refused when the device can do neither.
  bool symmetric_rss = 8;

  /// Negotiates RX MARK delivery (D-185): RTE_ETH_RX_METADATA_USER_MARK is
  /// requested before the device is configured, as DPDK's contract asks.
  /// Refused when the PMD answers without it; a PMD that has no negotiation
  /// (-ENOTSUP) is assumed to deliver it, as DPDK specifies. Some PMDs need it
  /// (sfc refuses MARK rules without it); others deliver a rule's MARK either
  /// way (mlx5 enables delivery when a MARK rule is created). PortInc/QueueInc
  /// `mark_attr` hands the MARK to modules downstream.
  bool rx_mark = 9;
}

message UnixSocketPortArg {
  /// Set the first character to "@" in place of \0 for abstract path
  /// See manpage for unix(7).
  string path = 1;

  /// Minimum RX polling interval for system calls, when *idle*.
  /// Use a negative number for unthrottled polling. If unspecified or 0,
  /// it is set to 50,000 (50 microseconds, or 20k polls per second)
  int64 min_rx_interval_ns = 2;

  /// If set, the port driver will send a confirmation once
  /// the port is connected, so a test client can wait for the connection
  /// before it sends.
  bool confirm_connect = 3;
}
