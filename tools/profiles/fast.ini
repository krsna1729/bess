# Fast inner-loop profile (edit -> binary in seconds, small tree).
#   meson setup build/fast --native-file tools/profiles/fast.ini
# Into a new directory: `meson setup --wipe` keeps an old tree's -D options.
# -O1 and no debug info keep objects and executables small, and ccache makes a
# repeat cold build near-free. mold is the linker of every profile (meson.build).
# Benchmarks are off; use a perf/release tree for numbers.
[binaries]
cpp = ['ccache', 'g++']

[built-in options]
buildtype = 'plain'
cpp_args = ['-O1', '-g0']
# Meson's if-release (the project default, D-061) counts 'plain' as release;
# the inner loop keeps assert() and the libstdc++ checks.
b_ndebug = 'false'

[project options]
build_benchmarks = false
