[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-sdk"
version = "0.1.0"
description = "A thin client for BESS's generic control API (control_v2)"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    # The committed gencode under bess/controlv2/ is generated by protoc 36.1
    # and grpcio-tools 1.83.1: control_v2_pb2.py calls
    # ValidateProtobufRuntimeVersion(7.36.1) and the stubs declare
    # GRPC_GENERATED_VERSION = '1.83.1', so an older runtime fails at import.
    # Regenerating with an older pinned toolchain is the way to lower these.
    "grpcio>=1.83.1",
    "protobuf>=7.36.1",
]

[project.urls]
Homepage = "https://github.com/krsna1729/bess"

[tool.setuptools]
packages = ["bess", "bess.controlv2"]
