[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-sdk"
version = "0.1.0"
description = "A thin client for BESS's generic control API (control_v2)"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = [
    # The committed gencode under bess/controlv2/ is generated by
    # grpcio-tools 1.83.1, whose protoc also stamps its own protobuf version
    # into control_v2_pb2.py; tools/gen_python_sdk.sh normalizes that stamp to
    # the protobuf floor below, so the stamp does not depend on how
    # grpcio-tools was built (every other byte is still the packager's protoc
    # output). control_v2_pb2.py then calls
    # ValidateProtobufRuntimeVersion(7.36.1) and the stubs declare
    # GRPC_GENERATED_VERSION = '1.83.1', so an older runtime fails at import.
    # The protobuf floor has to equal the generator's stamp, which refuses to
    # run when they disagree, when protoc's own stamp is newer, or when it is
    # another major. The grpcio floor follows the grpcio-tools pin instead:
    # lowering it means changing that pin and regenerating.
    "grpcio>=1.83.1",
    "protobuf>=7.36.1",
]

[project.urls]
Homepage = "https://github.com/krsna1729/bess"

[tool.setuptools]
packages = ["bess", "bess.controlv2"]
