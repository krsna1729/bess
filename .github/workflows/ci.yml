name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]

env:
  # x86-64-v3 (AVX2, BMI1/2, FMA, MOVBE): the portable floor. GitHub's x64
  # Linux runners (AMD EPYC 7763, Zen 3) support it but not v4 (AVX-512);
  # the check step below fails loudly if a runner ever lacks it.
  # (Decision D-016.)
  CPU: x86-64-v3
  AF_XDP: required
  FIFO_TEST_TIMEOUT: 200

jobs:
  # Wire (and JSON) compatibility of the protobuf API against the branch's
  # previous state: a pull request against its base, a push against the
  # commit before it (D-026). An intentional break (the no-compatibility
  # cutovers) is declared with the "buf skip breaking" pull-request label.
  proto-compat:
    name: Protobuf compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Against the pull request's base
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          breaking: true
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=protobuf
      - name: Against the previous commit
        if: github.event_name == 'push'
        uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          breaking: true
          breaking_against: .git#ref=HEAD~1,subdir=protobuf

  build-and-test:
    name: Meson (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The ubuntu-24.04 pair gates. The ubuntu-26.04 lanes are experimental:
    # they exist to see the toolchain and library drift (GCC 15, Clang 22;
    # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19) before
    # it reaches the gating lanes, and they must not block a merge.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 14 (Ubuntu 24.04 noble-updates): the distro default is 13,
          # which lacks C++23 features the codebase may use (deducing this).
          - name: gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          # Clang 19 updates __cpp_concepts for libstdc++'s C++23 <expected>.
          - name: clang
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
          - name: gcc-u26
            os: ubuntu-26.04
            experimental: true
            cc: gcc-15
            cxx: g++-15
          - name: clang-u26
            os: ubuntu-26.04
            experimental: true
            cc: clang-22
            cxx: clang++-22

    steps:
      - uses: actions/checkout@v7

      - name: Check the runner supports the CPU floor
        run: |
          /lib64/ld-linux-x86-64.so.2 --help | grep -A4 'glibc-hwcaps'
          if ! /lib64/ld-linux-x86-64.so.2 --help \
              | grep -q "${CPU} (supported"; then
            echo "::error::runner CPU does not support ${CPU}"
            exit 1
          fi

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build
          pip3 install --break-system-packages coverage

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-bess-${{ matrix.name }}-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      - name: Bootstrap pinned DPDK
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          tools/bootstrap_dpdk.py --af-xdp required --cpu "$CPU" --profile bess
          echo "PKG_CONFIG_PATH=$(tools/bootstrap_dpdk.py --print-pkg-config-path)" >> "$GITHUB_ENV"

      - name: Configure BESS
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          meson setup "build/${{ matrix.name }}" \
            -Dcpu="$CPU" \
            -Daf_xdp=required \
            -Dbuildtype=debugoptimized \
            -Dbuild_sample_plugin=true

      - name: Build BESS
        run: meson compile -C "build/${{ matrix.name }}" -j4

      - name: Verify AF_XDP artifacts
        run: |
          dpdk_libdir=$(pkg-config --variable=libdir libdpdk)
          test -f "$dpdk_libdir/librte_net_af_xdp.so"
          test -f "$dpdk_libdir/librte_net_af_xdp.a"

      - name: Check layer include dependencies
        run: |
          python3 tools/check_includes.py --self-test
          python3 tools/check_includes.py

      - name: Run all Meson tests
        run: meson test -C "build/${{ matrix.name }}" --no-rebuild --print-errorlogs

      - name: Verify install tree and external plugin API
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          stage="$PWD/build/stage-${{ matrix.name }}"
          meson install -C "build/${{ matrix.name }}" --destdir "$stage"
          pc_file=$(find "$stage" -type f -name bess-dev.pc -print -quit)
          test -n "$pc_file"
          export PKG_CONFIG_PATH="$(dirname "$pc_file")${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export CXXFLAGS="-I$stage/usr/local/include/bess -I$stage/usr/local/include/bess/core ${CXXFLAGS:-}"
          python3 tools/check_installed_headers.py \
            --include-dir "$stage/usr/local/include/bess/core"
          meson setup "build/standalone-${{ matrix.name }}" examples/standalone_plugin
          meson compile -C "build/standalone-${{ matrix.name }}"
          for plugin in standalone_pass standalone_macswap standalone_range_gate; do
            so="build/standalone-${{ matrix.name }}/lib${plugin}.so"
            test -f "$so"
            nm -D --defined-only "$so" | grep -q bess_plugin_descriptor_v1
          done
          python3 - "$stage" <<'PY'
          import os
          from pathlib import Path
          import sys

          stage = Path(sys.argv[1])
          bessd = list(stage.glob('**/bin/bessd'))
          plugins = list(stage.glob('**/bess/modules/libsequential_update.so'))
          assert len(bessd) == 1, bessd
          assert len(plugins) == 1, plugins
          assert os.access(bessd[0], os.X_OK), bessd[0]
          PY

      - name: Verify installed Python client
        run: |
          python3 tools/check_installed_pybess.py \
            --root "$PWD/build/stage-${{ matrix.name }}/usr/local/share/bess"

      - name: Dump daemon logs on failure
        if: failure()
        run: cat /tmp/bessd.*.INFO.* 2>/dev/null || true

  publish-release:
    name: Package and Publish Release Binaries
    needs: [proto-compat, build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    # The shipped binaries are built by the compiler the gating gcc lane tests.
    # Without this the job used the image's default g++ (13.3), which no other
    # job builds with.
    env:
      CC: gcc-14
      CXX: g++-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-full-gcc14-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      - name: Bootstrap pinned DPDK
        run: |
          tools/bootstrap_dpdk.py --af-xdp required --cpu "$CPU" --profile full
          echo "PKG_CONFIG_PATH=$(tools/bootstrap_dpdk.py --print-pkg-config-path)" >> "$GITHUB_ENV"

      - name: Configure Standalone Release Build
        run: |
          meson setup build/standalone \
            -Dcpu="$CPU" \
            -Dbuildtype=release \
            -Dstatic_binary=standalone \
            -Daf_xdp=required \
            -Dbuild_benchmarks=false \
            -Dbuild_sample_plugin=false

      - name: Build Standalone Binaries
        run: meson compile -C build/standalone -j4 core/bessd

      - name: Verify zero dynamic DPDK dependencies
        run: |
          if ldd build/standalone/core/bessd | grep -i librte; then
            echo "::error::bessd has unexpected dynamic DPDK dependencies"
            exit 1
          fi

      - name: Package Release Tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ -z "$VERSION" ] && VERSION=$(git rev-parse --short HEAD)
          TARNAME="bess-${VERSION}-linux-x86_64"
          mkdir -p "$TARNAME/bin"
          cp build/standalone/core/bessd "$TARNAME/bin/"
          cp bin/bessctl "$TARNAME/bin/"
          cp bin/dpdk-devbind.py "$TARNAME/bin/"
          cp -r bessctl "$TARNAME/"
          cp -r pybess "$TARNAME/"
          cp README.md LICENSE COPYING "$TARNAME/" 2>/dev/null || true
          tar -czvf "${TARNAME}.tar.gz" "$TARNAME"
          sha256sum "${TARNAME}.tar.gz" > "${TARNAME}.tar.gz.sha256"
          echo "RELEASE_TARNAME=${TARNAME}" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TARNAME }}
          path: |
            ${{ env.RELEASE_TARNAME }}.tar.gz
            ${{ env.RELEASE_TARNAME }}.tar.gz.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_TARNAME }}.tar.gz
            ${{ env.RELEASE_TARNAME }}.tar.gz.sha256
          generate_release_notes: true
