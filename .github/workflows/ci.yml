name: CI

# 2026 CI baseline: GitHub Actions on Ubuntu 24.04, Python 3 only, DPDK
# 25.11 LTS built natively on the runner via Meson/Ninja (see build.py and
# core/Makefile). This replaced the original version of this workflow,
# which built against a pinned Ubuntu Bionic / DPDK 19.11.4 container --
# that container has no meson/ninja and far-too-old compilers for DPDK
# 25.11, so it can no longer build this tree at all.
#
# Known gaps intentionally left for follow-up work:
#  - core/kmod build/build-test is not run here: it depends on matching
#    kernel headers on the runner and is a known-broken legacy path on
#    modern kernels (see upstream NetSys/bess#1056). It is expected to be
#    made optional entirely once VFIO/AF_XDP become the primary I/O paths.
#  - No sanitizer (ASan/UBSan) or coverage lane yet -- the old workflow
#    had one via the pinned container's clang-6.0; re-adding one against
#    a current clang is follow-up work, not re-created here.
#
# CPU=corei7 below is load-bearing, not a style choice: DPDK's build
# defaults to `-march=native`, and the "Cache DPDK build" step below
# persists that build across separate CI runs -- but different runs can
# land on different actual GitHub-hosted runner hardware, so a DPDK
# build compiled `native` on one run's CPU can contain instructions the
# next run's CPU doesn't have. This was not hypothetical: it happened
# twice in a row (runs 34701174001, 34701493223 -- both "Illegal
# instruction (core dumped)" a fraction of a second into `all_test`,
# clang++ job only, immediately after a prior run had built and cached a
# `native` DPDK). `corei7` is DPDK's own documented portable baseline
# (what `-Dmachine=generic` resolves to on x86; see
# deps/dpdk-*/config/meson.build) -- old enough (~2008) to be safe on
# every CPU in GitHub's fleet, verified locally to build and pass the
# full test suite and benchmark smoke test with no regressions (it just
# takes the existing non-AVX2 fallback paths, e.g. in
# core/utils/checksum.h's `#if __AVX2__` guard, at compile time).

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  FIFO_TEST_TIMEOUT: 200
  CPU: corei7

jobs:
  build-and-test:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g++
            cxx: g++
          - name: clang++
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang meson ninja-build pkg-config \
            python3-pip python3-pyelftools xz-utils \
            libnuma-dev libpcap-dev zlib1g-dev \
            libgoogle-glog-dev libgflags-dev libgtest-dev libbenchmark-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev \
            protobuf-compiler libsystemd-dev libc-ares-dev libcap-dev
          # Deliberately not using actions/setup-python: it swaps python3 to
          # a hosted interpreter that can't see apt-installed modules like
          # the pyelftools above (DPDK's meson build needs it), and
          # ubuntu-24.04 already ships Python 3.12 as the system python3.
          # --break-system-packages: Ubuntu 24.04's system Python enforces
          # PEP 668; there's no venv here to isolate into, and this runner
          # is single-purpose/ephemeral anyway.
          pip3 install --break-system-packages -r requirements.txt coverage

      - name: Cache DPDK build
        uses: actions/cache@v4
        with:
          path: deps
          # env.CPU is part of the key deliberately: it controls the
          # -march/-mcpu DPDK itself gets built with (see the CPU=corei7
          # comment up top), and hashFiles('build.py') alone wouldn't
          # reflect a change to it -- a stale cache built under an old
          # CPU setting must not get silently reused under a new one.
          key: dpdk-${{ matrix.name }}-${{ env.CPU }}-${{ hashFiles('build.py') }}

      - name: Build BESS
        env:
          CXX: ${{ matrix.cxx }}
        run: ./build.py bess

      - name: Run core unit tests
        working-directory: core
        run: ./all_test --gtest_shuffle

      - name: Smoke-test benchmarks
        working-directory: core
        # Not for perf tracking (too much runner-to-runner variance for
        # that) -- just confirms every *_bench binary actually runs to
        # completion. build.py's build_bess() didn't build the
        # `benchmarks` Makefile target until this was added, so these
        # binaries had never been exercised against the DPDK 25.11 port
        # at all before now. --benchmark_min_time is kept tiny so this
        # stays a fast smoke check, not a real measurement.
        run: |
          for b in *_bench; do
            echo "=== $b ==="
            ./"$b" --benchmark_min_time=0.001s
          done

      - name: Run bessctl/pybess unit tests (Python 3)
        run: python3 -m unittest discover -v

      - name: Run module tests (Python 3)
        run: python3 bessctl/run_module_tests.py

      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/bessd.*.INFO.* 2>/dev/null || true
