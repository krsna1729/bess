name: CI

# 2026 CI baseline: GitHub Actions on Ubuntu 24.04, Python 3 only, DPDK
# 25.11 LTS built natively on the runner via Meson/Ninja (see build.py and
# core/Makefile). This replaced the original version of this workflow,
# which built against a pinned Ubuntu Bionic / DPDK 19.11.4 container --
# that container has no meson/ninja and far-too-old compilers for DPDK
# 25.11, so it can no longer build this tree at all.
#
# Known gaps intentionally left for follow-up work:
#  - core/kmod build/build-test is not run here: it depends on matching
#    kernel headers on the runner and is a known-broken legacy path on
#    modern kernels (see upstream NetSys/bess#1056). It is expected to be
#    made optional entirely once VFIO/AF_XDP become the primary I/O paths.
#  - No sanitizer (ASan/UBSan) or coverage lane yet -- the old workflow
#    had one via the pinned container's clang-6.0; re-adding one against
#    a current clang is follow-up work, not re-created here.
#  - DPDK is rebuilt from source on every run (no cache): it's a genuine
#    multi-minute build. Worth caching deps/dpdk-*/ keyed on DPDK_VER
#    once this is otherwise stable.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  FIFO_TEST_TIMEOUT: 200

jobs:
  build-and-test:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: g++
            cxx: g++
          - name: clang++
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang meson ninja-build pkg-config \
            python3-pip python3-pyelftools xz-utils \
            libnuma-dev libpcap-dev zlib1g-dev \
            libgoogle-glog-dev libgflags-dev libgtest-dev libbenchmark-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev \
            protobuf-compiler libsystemd-dev libc-ares-dev libcap-dev
          # Deliberately not using actions/setup-python: it swaps python3 to
          # a hosted interpreter that can't see apt-installed modules like
          # the pyelftools above (DPDK's meson build needs it), and
          # ubuntu-24.04 already ships Python 3.12 as the system python3.
          # --break-system-packages: Ubuntu 24.04's system Python enforces
          # PEP 668; there's no venv here to isolate into, and this runner
          # is single-purpose/ephemeral anyway.
          pip3 install --break-system-packages -r requirements.txt coverage

      - name: Cache DPDK build
        uses: actions/cache@v4
        with:
          path: deps
          key: dpdk-${{ matrix.name }}-${{ hashFiles('build.py') }}

      - name: Build BESS
        env:
          CXX: ${{ matrix.cxx }}
        run: ./build.py bess

      - name: Run core unit tests
        working-directory: core
        run: ./all_test --gtest_shuffle

      - name: Run bessctl/pybess unit tests (Python 3)
        run: python3 -m unittest discover -v

      - name: Run module tests (Python 3)
        run: python3 bessctl/run_module_tests.py

      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/bessd.*.INFO.* 2>/dev/null || true
