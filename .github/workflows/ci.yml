name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CPU: corei7
  AF_XDP: required
  FIFO_TEST_TIMEOUT: 200

jobs:
  build-and-test:
    name: Meson (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 14 (Ubuntu 24.04 noble-updates): the distro default is 13,
          # which lacks C++23 features the codebase may use (deducing this).
          - name: gcc
            cc: gcc-14
            cxx: g++-14
          # Clang 19 updates __cpp_concepts for libstdc++'s C++23 <expected>.
          - name: clang
            cc: clang-19
            cxx: clang++-19

    steps:
      - uses: actions/checkout@v7

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build
          pip3 install --break-system-packages coverage

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-${{ matrix.name }}-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      - name: Bootstrap pinned DPDK
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          tools/bootstrap_dpdk.py --af-xdp required --cpu "$CPU"
          echo "PKG_CONFIG_PATH=$(tools/bootstrap_dpdk.py --print-pkg-config-path)" >> "$GITHUB_ENV"

      - name: Configure BESS
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          meson setup "build-${{ matrix.name }}" \
            -Dcpu="$CPU" \
            -Daf_xdp=required \
            -Dbuildtype=debugoptimized \
            -Dbuild_sample_plugin=true

      - name: Build BESS
        run: meson compile -C "build-${{ matrix.name }}" -j4

      - name: Verify AF_XDP artifacts
        run: |
          dpdk_libdir=$(pkg-config --variable=libdir libdpdk)
          test -f "$dpdk_libdir/librte_net_af_xdp.so"
          test -f "$dpdk_libdir/librte_net_af_xdp.a"

      - name: Run all Meson tests
        run: meson test -C "build-${{ matrix.name }}" --print-errorlogs

      - name: Verify install tree
        run: |
          meson install -C "build-${{ matrix.name }}" --destdir "$PWD/stage-${{ matrix.name }}"
          python3 - "$PWD/stage-${{ matrix.name }}" <<'PY'
          import os
          from pathlib import Path
          import sys

          stage = Path(sys.argv[1])
          bessd = list(stage.glob('**/bin/bessd'))
          plugins = list(stage.glob('**/bess/modules/libsequential_update.so'))
          assert len(bessd) == 1, bessd
          assert len(plugins) == 1, plugins
          assert os.access(bessd[0], os.X_OK), bessd[0]
          PY

      - name: Verify installed Python client
        run: |
          python3 tools/check_installed_pybess.py \
            --root "$PWD/stage-${{ matrix.name }}/usr/local/share/bess"

      - name: Dump daemon logs on failure
        if: failure()
        run: cat /tmp/bessd.*.INFO.* 2>/dev/null || true
