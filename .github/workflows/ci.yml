name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  # Nightly: every lane and the benchmark suite on develop, even without a
  # push (docs/ci-parity.md). A schedule runs on the default branch (master),
  # so every checkout below names develop for it.
  schedule:
    - cron: '17 3 * * *'

# A newer commit cancels the older run it supersedes: per pull request, per
# branch for pushes (develop, master), and the nightly run its predecessor
# (its own group: a schedule runs on master's ref but checks out develop).
# Tags are never grouped: a release run always completes. The tip's run (and
# the nightly) covers every commit a cancelled run would have.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.event_name == 'schedule' && 'nightly'
    || startsWith(github.ref, 'refs/tags/') && github.run_id
    || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The CPU floor is per architecture and comes from tools/ci_profile.py
  # (x86_64: x86-64-v3, decision D-016; aarch64: armv8.2-a, M21). The first
  # step of each job writes it to CPU and fails loudly if the runner lacks it.
  AF_XDP: required
  FIFO_TEST_TIMEOUT: 200

jobs:
  # Wire (and JSON) compatibility of the protobuf API against the branch's
  # previous state: a pull request against its base, a push against the
  # commit before it (D-026). An intentional break (the no-compatibility
  # cutovers) is declared with the "buf skip breaking" pull-request label.
  proto-compat:
    name: Protobuf compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Against the pull request's base
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          # The result is the check's status; commenting would need
          # pull-requests: write, which this workflow does not grant.
          pr_comment: false
          breaking: true
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=protobuf
      - name: Against the previous commit
        if: github.event_name == 'push'
        uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          breaking: true
          breaking_against: .git#ref=HEAD~1,subdir=protobuf

  # The Go control SDK (M27): its generated code is what the pinned generator
  # makes from protobuf/control_v2.proto, and it vets and passes its tests.
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - name: Regenerate and compare
        run: |
          tools/gen_go_sdk.sh
          git diff --exit-code -- sdk/go
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Vet and test
        working-directory: sdk/go
        run: |
          go vet ./...
          go test -race -count=1 ./...

  # The lane table lives in tools/ci_profile.py (LANES, with the compiler
  # pins); pull requests run the gating pair and the sanitizer lanes, pushes
  # every lane (docs/ci-parity.md).
  lanes:
    name: Lanes
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          sparse-checkout: tools/ci_profile.py
          sparse-checkout-cone-mode: false
      - id: pick
        run: python3 tools/ci_profile.py lanes --event ${{ github.event_name }} >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Meson (${{ matrix.name }})
    needs: lanes
    runs-on: ${{ matrix.os }}
    # Only the gating lanes (ubuntu-24.04 x86 gcc and clang) may block a merge.
    continue-on-error: ${{ matrix.experimental }}
    env:
      LANE: --cc ${{ matrix.cc }} --cxx ${{ matrix.cxx }} --name ${{ matrix.name }} ${{ matrix.lane_args }}
      CCACHE_MAXSIZE: 500M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lanes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          # The merge commit and its base parent: tidy checks a pull
          # request's changed sources.
          fetch-depth: 2

      # x86_64: glibc's ld.so lists the ISA levels the CPU supports; aarch64:
      # the kernel's /proc/cpuinfo features (tools/ci_profile.py check-cpu).
      - name: Check the runner supports the CPU floor
        run: |
          echo "CPU=$(python3 tools/ci_profile.py cpu)" >> "$GITHUB_ENV"
          python3 tools/ci_profile.py check-cpu

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge
          grep -E 'HugePages_Total|Hugepagesize' /proc/meminfo

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build
          pip3 install --break-system-packages coverage

      # The integration suite runs the Go control SDK against bessd
      # (bessctl/module_tests/control_sdk_go.py).
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-bess-${{ matrix.name }}-${{ runner.arch }}-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      # The configuration and the verification steps live in tools/ci_profile.py,
      # which a developer runs unchanged (docs/ci-parity.md).
      # Compiler cache per lane, outside the checkout (clean-tree checks the
      # tree is unchanged). Every run restores the newest; only pushes and the
      # nightly run save (a pull request's 500 MB per lane would churn the
      # repository's 10 GB cache and evict the DPDK caches).
      - name: Locate the compiler cache
        run: echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"

      - name: Restore compiler output
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.name }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-${{ runner.arch }}-

      - name: Check the lanes' compiler pins
        run: python3 tools/ci_profile.py check-pins

      - name: Bootstrap pinned DPDK
        run: python3 tools/ci_profile.py bootstrap $LANE

      - name: Configure BESS
        run: python3 tools/ci_profile.py configure $LANE

      - name: Build BESS
        run: python3 tools/ci_profile.py build $LANE

      - name: Verify AF_XDP artifacts
        run: python3 tools/ci_profile.py verify-dpdk $LANE

      - name: Check layer include dependencies
        run: python3 tools/ci_profile.py layers $LANE

      - name: Curated clang-tidy (clang-asan lane only)
        run: python3 tools/ci_profile.py tidy $LANE

      - name: Run all Meson tests
        run: python3 tools/ci_profile.py test $LANE

      - name: Live performance, report only (gcc lane, pushes and nightly)
        # tools/live_perf.py's F and M tests on the lane's build: a trend to
        # compare between runs' artifacts, never a gate (D-092).
        if: matrix.name == 'gcc' && github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tools/ci_profile.py live-perf $LANE

      - name: Upload live performance
        if: matrix.name == 'gcc' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: live-perf-${{ github.sha }}
          path: build/gcc/live-perf.json
          if-no-files-found: ignore

      - name: Verify install tree, external plugin API and Python client
        run: python3 tools/ci_profile.py verify-install $LANE

      - name: Check the build left the source tree unchanged
        run: python3 tools/ci_profile.py clean-tree $LANE

      - name: Dump daemon logs on failure
        if: failure()
        run: cat /tmp/bessd.*.INFO.* 2>/dev/null || true

      - name: Save compiler output
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.name }}-${{ runner.arch }}-${{ github.sha }}

  publish-release:
    name: Package and Publish Release Binaries
    needs: [proto-compat, build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    # The shipped binaries are built by the compiler the gating gcc lane tests
    # (without a pin the job used the image's default g++ 13.3, which no other
    # job builds with), through the same script and compiler authority as the
    # gating lanes. The release-specific options are in tools/ci_profile.py.
    # x86_64 only until the arm64 lanes gate; the tarball and the DPDK cache
    # are named per architecture, so an arm64 release is one more runner.
    env:
      LANE: --cc gcc-14 --cxx g++-14 --name standalone
    permissions:
      contents: write
      id-token: write  # Sigstore keyless signing (D-093): GitHub's OIDC identity, no stored keys
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the CPU floor
        run: echo "CPU=$(python3 tools/ci_profile.py cpu)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-full-gcc14-${{ runner.arch }}-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      - name: Bootstrap pinned DPDK
        run: python3 tools/ci_profile.py release-bootstrap $LANE

      - name: Configure Standalone Release Build
        run: python3 tools/ci_profile.py release-configure $LANE

      - name: Build Standalone Binaries
        run: python3 tools/ci_profile.py release-build $LANE

      - name: Verify zero dynamic DPDK dependencies
        run: python3 tools/ci_profile.py release-verify $LANE

      - name: Package release artifacts (tarball, .deb, runtime image)
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION=$(git rev-parse --short HEAD)
          mkdir -p dist
          python3 tools/package_release.py tarball --build build/standalone --version "$VERSION" --out dist
          python3 tools/package_release.py deb --build build/standalone --version "$VERSION" --out dist
          DEB=$(cd dist && ls bess_*.deb)
          docker build -f env/runtime.Dockerfile --build-arg DEB="$DEB" -t bess:"$VERSION" dist
          # The image's bessd reports its version, then starts for real: DPDK
          # up, packet pools created, the control server listening. Still
          # running after 5 s (timeout's 124) is a pass; a startup failure
          # exits earlier (D-096: a static DPDK without its mempool handlers
          # passed --version and aborted at the first pool).
          docker run --rm --entrypoint /usr/local/bin/bessd bess:"$VERSION" --version
          set +e
          docker run --rm --entrypoint timeout bess:"$VERSION" 5 /usr/local/bin/bessd -f -m 0 --skip_root_check
          rc=$?
          set -e
          [ "$rc" = 124 ] || { echo "bessd exited with $rc before the 5 s smoke window"; exit 1; }
          docker save bess:"$VERSION" | gzip > dist/bess-image-"$VERSION"-$(uname -m).tar.gz
          (cd dist && sha256sum *.deb bess-image-*.tar.gz >> SHA256SUMS)
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (Sigstore keyless)
        # Each artifact gets a .sigstore.json bundle: the signature, the
        # certificate naming this workflow run, and the transparency-log entry.
        # Verify with:
        #   cosign verify-blob --bundle F.sigstore.json \
        #     --certificate-identity-regexp 'https://github.com/krsna1729/bess/.github/workflows/ci.yml@.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com F
        run: |
          cd dist
          for f in *.tar.gz *.deb SHA256SUMS; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bess-${{ env.RELEASE_VERSION }}-linux-${{ runner.arch }}
          path: dist/

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
