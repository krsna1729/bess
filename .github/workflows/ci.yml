name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]

env:
  # x86-64-v3 (AVX2, BMI1/2, FMA, MOVBE): the portable floor. GitHub's x64
  # Linux runners (AMD EPYC 7763, Zen 3) support it but not v4 (AVX-512);
  # the check step below fails loudly if a runner ever lacks it.
  # (Decision D-016.)
  CPU: x86-64-v3
  AF_XDP: required
  FIFO_TEST_TIMEOUT: 200

jobs:
  # Wire (and JSON) compatibility of the protobuf API against the branch's
  # previous state: a pull request against its base, a push against the
  # commit before it (D-026). An intentional break (the no-compatibility
  # cutovers) is declared with the "buf skip breaking" pull-request label.
  proto-compat:
    name: Protobuf compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Against the pull request's base
        if: github.event_name == 'pull_request'
        uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          # The result is the check's status; commenting would need
          # pull-requests: write, which this workflow does not grant.
          pr_comment: false
          breaking: true
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=protobuf
      - name: Against the previous commit
        if: github.event_name == 'push'
        uses: bufbuild/buf-action@v1
        with:
          lint: false
          format: false
          push: false
          breaking: true
          breaking_against: .git#ref=HEAD~1,subdir=protobuf

  build-and-test:
    name: Meson (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The ubuntu-24.04 pair gates. The ubuntu-26.04 lanes are experimental:
    # they exist to see the toolchain and library drift (GCC 15, Clang 22;
    # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19) before
    # it reaches the gating lanes, and they must not block a merge.
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      LANE: --cc ${{ matrix.cc }} --cxx ${{ matrix.cxx }} --name ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 14 (Ubuntu 24.04 noble-updates): the distro default is 13,
          # which lacks C++23 features the codebase may use (deducing this).
          - name: gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          # Clang 19 updates __cpp_concepts for libstdc++'s C++23 <expected>.
          - name: clang
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
          - name: gcc-u26
            os: ubuntu-26.04
            experimental: true
            cc: gcc-15
            cxx: g++-15
          - name: clang-u26
            os: ubuntu-26.04
            experimental: true
            cc: clang-22
            cxx: clang++-22

    steps:
      - uses: actions/checkout@v7

      - name: Check the runner supports the CPU floor
        run: |
          /lib64/ld-linux-x86-64.so.2 --help | grep -A4 'glibc-hwcaps'
          if ! /lib64/ld-linux-x86-64.so.2 --help \
              | grep -q "${CPU} (supported"; then
            echo "::error::runner CPU does not support ${CPU}"
            exit 1
          fi

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build
          pip3 install --break-system-packages coverage

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-bess-${{ matrix.name }}-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      # The configuration and the verification steps live in tools/ci_profile.py,
      # which a developer runs unchanged (docs/ci-parity.md).
      - name: Check the script's compiler pins match this matrix
        run: python3 tools/ci_profile.py check-pins

      - name: Bootstrap pinned DPDK
        run: python3 tools/ci_profile.py bootstrap $LANE

      - name: Configure BESS
        run: python3 tools/ci_profile.py configure $LANE

      - name: Build BESS
        run: python3 tools/ci_profile.py build $LANE

      - name: Verify AF_XDP artifacts
        run: python3 tools/ci_profile.py verify-dpdk $LANE

      - name: Check layer include dependencies
        run: python3 tools/ci_profile.py layers $LANE

      - name: Run all Meson tests
        run: python3 tools/ci_profile.py test $LANE

      - name: Verify install tree, external plugin API and Python client
        run: python3 tools/ci_profile.py verify-install $LANE

      - name: Check the build left the source tree unchanged
        run: python3 tools/ci_profile.py clean-tree $LANE

      - name: Dump daemon logs on failure
        if: failure()
        run: cat /tmp/bessd.*.INFO.* 2>/dev/null || true

  publish-release:
    name: Package and Publish Release Binaries
    needs: [proto-compat, build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    # The shipped binaries are built by the compiler the gating gcc lane tests
    # (without a pin the job used the image's default g++ 13.3, which no other
    # job builds with), through the same script and compiler authority as the
    # gating lanes. The release-specific options are in tools/ci_profile.py.
    env:
      LANE: --cc gcc-14 --cxx g++-14 --name standalone
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo bash env/install-deps.sh runtime
          sudo bash env/install-deps.sh build

      - name: Cache DPDK
        uses: actions/cache@v6
        with:
          path: deps
          key: dpdk-full-gcc14-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      - name: Bootstrap pinned DPDK
        run: python3 tools/ci_profile.py release-bootstrap $LANE

      - name: Configure Standalone Release Build
        run: python3 tools/ci_profile.py release-configure $LANE

      - name: Build Standalone Binaries
        run: python3 tools/ci_profile.py release-build $LANE

      - name: Verify zero dynamic DPDK dependencies
        run: python3 tools/ci_profile.py release-verify $LANE

      - name: Package Release Tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ -z "$VERSION" ] && VERSION=$(git rev-parse --short HEAD)
          TARNAME="bess-${VERSION}-linux-x86_64"
          mkdir -p "$TARNAME/bin"
          cp build/standalone/core/bessd "$TARNAME/bin/"
          cp bin/bessctl "$TARNAME/bin/"
          cp bin/dpdk-devbind.py "$TARNAME/bin/"
          cp -r bessctl "$TARNAME/"
          cp -r pybess "$TARNAME/"
          cp README.md LICENSE COPYING "$TARNAME/" 2>/dev/null || true
          tar -czvf "${TARNAME}.tar.gz" "$TARNAME"
          sha256sum "${TARNAME}.tar.gz" > "${TARNAME}.tar.gz.sha256"
          echo "RELEASE_TARNAME=${TARNAME}" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TARNAME }}
          path: |
            ${{ env.RELEASE_TARNAME }}.tar.gz
            ${{ env.RELEASE_TARNAME }}.tar.gz.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_TARNAME }}.tar.gz
            ${{ env.RELEASE_TARNAME }}.tar.gz.sha256
          generate_release_notes: true
