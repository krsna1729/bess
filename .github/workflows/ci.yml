name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CPU: corei7
  AF_XDP: required
  FIFO_TEST_TIMEOUT: 200

jobs:
  build-and-test:
    name: Meson (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          sudo mkdir -p /mnt/huge
          sudo mount -t hugetlbfs nodev /mnt/huge

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang meson ninja-build pkg-config \
            python3-pip python3-pyelftools xz-utils \
            libnuma-dev libpcap-dev zlib1g-dev libunwind-dev \
            libbpf-dev libxdp-dev \
            libgoogle-glog-dev libgflags-dev libgtest-dev libbenchmark-dev \
            libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev \
            protobuf-compiler libsystemd-dev libc-ares-dev libcap-dev
          pip3 install --break-system-packages -r requirements.txt coverage

      - name: Cache DPDK
        uses: actions/cache@v4
        with:
          path: deps
          key: dpdk-${{ matrix.name }}-${{ env.CPU }}-${{ hashFiles('deps/dpdk.json', 'tools/bootstrap_dpdk.py') }}

      - name: Bootstrap pinned DPDK
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          tools/bootstrap_dpdk.py --af-xdp required --cpu "$CPU"
          echo "PKG_CONFIG_PATH=$(tools/bootstrap_dpdk.py --print-pkg-config-path)" >> "$GITHUB_ENV"

      - name: Configure BESS
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          meson setup "build-${{ matrix.name }}" \
            -Dcpu="$CPU" \
            -Daf_xdp=required \
            -Dbuildtype=debugoptimized \
            -Dbuild_sample_plugin=true

      - name: Build BESS
        run: meson compile -C "build-${{ matrix.name }}" -j4

      - name: Verify AF_XDP artifacts
        run: |
          dpdk_libdir=$(pkg-config --variable=libdir libdpdk)
          test -f "$dpdk_libdir/librte_net_af_xdp.so"
          test -f "$dpdk_libdir/librte_net_af_xdp.a"

      - name: Run all Meson tests
        run: meson test -C "build-${{ matrix.name }}" --print-errorlogs

      - name: Verify install tree
        run: |
          meson install -C "build-${{ matrix.name }}" --destdir "$PWD/stage-${{ matrix.name }}"
          test -x "stage-${{ matrix.name }}/usr/local/bin/bessd"
          test -f "stage-${{ matrix.name }}/usr/local/lib/bess/modules/libsequential_update.so"

      - name: Dump daemon logs on failure
        if: failure()
        run: cat /tmp/bessd.*.INFO.* 2>/dev/null || true
