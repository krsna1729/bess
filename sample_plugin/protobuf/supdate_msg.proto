syntax = "proto3";

package sample.supdate.pb;

/**
 * The SequentialUpdate module rewrites a specified field (`offset` and `size`) in a packet
 * with a sequentially increased value from a specified min to max values.
 *
 * Exactly `size` bytes are written, big-endian; the bytes around the field
 * are untouched. Fields are written into the packet's first segment: a packet
 * whose first segment is shorter than the largest `offset` + `size` is dropped
 * rather than partly written. A packet whose payload is shared (a clone) is
 * copied first, so the payload's other holders never see the write, and a
 * packet whose copy fails is dropped.
 *
 * __Input Gates__: 1
 * __Output Gates__: 1
 */
message SequentialUpdateArg {
  /**
   * SequentialUpdate's Field specifies where to rewrite, and what values to rewrite
   * in each packet processed.
   */
  message Field {
    int64 offset = 1; /// Offset in bytes for where to rewrite. 0 or more, and offset + size must fit the packet data room (bessd --packet_data_room, 2048 by default).
    uint64 size = 2; /// The number of bytes to write: 1, 2 or 4.
    uint64 min = 3; /// The minimum value to insert into the packet.
    uint64 max = 4; /// The maximum value to insert into the packet.
  }
  repeated Field fields = 1; /// A list of SequentialUpdate Fields.
}
